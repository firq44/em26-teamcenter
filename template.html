/* palette taken 1:1 from hltv.org */
:root{--bg:#1a2129;--pan:#2d3844;--pan2:#364250;--dark:#232a30;--line:#3b4653;--tx:#dfe4e8;--mut:#929a9e;--acc:#87a3bf;--blue:#5b9dd9;--gold:#f0a83a;--good:#7ebd5a;--bad:#cd5b52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'Open Sans','Segoe UI',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.panel{background:var(--pan);border-radius:6px;margin-bottom:10px;overflow:hidden}
.photos{display:flex;background:#1a1f24;padding:0}
.photos .pl{flex:1;position:relative;cursor:pointer;border-right:1px solid #0a1119;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.photos .pl:last-child{border:none}
.photos .pl img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.photos .av{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#1a1f24}
.photos .nm{position:relative;background:linear-gradient(transparent,rgba(6,12,18,.95));padding:22px 8px 8px;font-weight:700;display:flex;align-items:center;gap:6px;z-index:2}
.photos .pl:hover img.ph{transform:scale(1.04);transition:.2s}
.fl{font-size:14px;line-height:1}
.thead{display:flex;align-items:flex-start;gap:16px;padding:16px;position:relative;overflow:hidden}
.thead .bg{position:absolute;right:-30px;top:-30px;height:170px;opacity:.07;pointer-events:none}
.tlogo{width:96px;height:96px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;z-index:1}
.tlogo img{max-width:100%;max-height:100%}
.treg{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
h1{margin:2px 0 10px;font-size:30px;font-weight:800}
.socials{margin-left:auto;display:flex;gap:6px;z-index:1}
.socials a{width:34px;height:34px;border-radius:6px;background:var(--pan2);display:flex;align-items:center;justify-content:center;color:var(--mut);text-decoration:none;font-size:14px}
.ranks{display:flex;gap:30px;margin-top:2px}
.ranks .r{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.ranks .r b{color:var(--tx);font-size:15px}
.inforow{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:13px}
.inforow .k{color:var(--tx)}.inforow .v{color:var(--mut);display:flex;align-items:center;gap:6px}
.trophies{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.trophy{width:40px;height:46px;background:var(--pan2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;padding:4px}.trophy img{max-width:100%;max-height:100%;object-fit:contain}.tpl{position:absolute;bottom:-2px;right:-2px;background:#1a1f24;border-radius:3px;font-size:9px;padding:1px 4px;color:var(--mut)}
.tabs{display:flex;gap:3px;background:var(--pan);border-radius:8px;margin-bottom:10px;padding:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tabs button{background:none;border:none;color:var(--mut);padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;transition:background .12s,color .12s}
.tabs button .ti{font-size:13px;opacity:.85}
.tabs button:hover:not(.on){color:var(--tx);background:rgba(255,255,255,.05)}
.tabs button.on{background:var(--pan2);color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
sec{display:none}sec.on{display:block}
.box{background:var(--pan);border-radius:6px;padding:16px;margin-bottom:10px;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.chartkpis{display:flex;gap:40px;margin-bottom:10px}
.chartkpis .c b{font-size:20px}.chartkpis .c span{color:var(--mut);font-size:11px;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:600;cursor:pointer}th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--pan2)}
.pcell{display:flex;align-items:center;gap:9px}.pcell .av{width:30px;height:30px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#1a1f24}
.pcell .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.sub{color:var(--mut);font-size:11px}
input.search{width:100%;max-width:300px;background:#232a30;border:1px solid var(--line);border-radius:5px;color:var(--tx);padding:8px 11px;margin-bottom:12px}

.rrow .rpts{flex:0 0 auto;text-align:right;min-width:56px}
.rrow .rpts b{font-size:14px;font-weight:800;display:inline}
.rrow .rpts span{color:var(--mut);font-size:10px;margin-left:2px}
.moves{display:flex;flex-direction:column;gap:5px}
.mvrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mvrow .mvin{color:var(--good);font-weight:800;width:16px;flex:0 0 auto}
.mvrow .mvout{color:var(--bad);font-weight:800;width:16px;flex:0 0 auto}
.mvrow .av{width:34px;height:38px;border-radius:5px;overflow:hidden;flex:0 0 auto;display:block;background:#20272e}
.mvrow .av img{width:100%;height:100%;object-fit:cover;object-position:top}
/* H2H + streak + form tiles */
.h2pill{display:inline-block;min-width:30px;text-align:center;padding:2px 5px;margin:1px;border-radius:4px;font-size:10px;font-weight:700;color:#fff}
.h2pill.w{background:#2e7d43}.h2pill.l{background:#a5392f}
.streak{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.stbig{font-size:15px;font-weight:800}.stbig.w{color:#4ba85a}.stbig.l{color:#c86b63}
.wlrow{display:flex;gap:4px;flex-wrap:wrap}
.wl{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.wl.w{background:#2e7d43}.wl.l{background:#a5392f}
/* MVP coin badge + tournament tooltip */
.mvpcoin{vertical-align:middle;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.mvpb{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:help;font-weight:800;color:var(--gold);line-height:1}
.mvpb.evp{color:#aeb7c4}
.mvptip{position:absolute;bottom:135%;left:50%;transform:translateX(-50%);background:#0d1116;color:#e8edf2;border:1px solid var(--gold);border-radius:7px;padding:7px 10px;font-size:11px;font-weight:600;z-index:80;opacity:0;visibility:hidden;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.55);pointer-events:none;max-width:260px;white-space:normal;text-align:left}
.mvpb.evp .mvptip{border-color:#7f8b9c}
.mvptip:before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold)}
.mvpb.evp .mvptip:before{border-top-color:#7f8b9c}
.mvpb:hover .mvptip{opacity:1;visibility:visible}
.mvptip b{color:var(--gold);display:block;margin-bottom:3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.mvptip .ev{display:block;padding:1px 0}
.mvphead{display:inline-flex;align-items:center;gap:9px}
/* season awards (nomination cards) */
.awgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.awcard{background:var(--pan2);border-radius:8px;padding:12px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.awcard:hover{background:#3e4b5a}
.awlbl{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:8px;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center}
.awph{width:72px;height:84px;border-radius:6px;object-fit:cover;object-position:top;background:#dde2e7}
.awnk{font-weight:700;margin-top:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.awrt{color:var(--mut);font-size:11px;margin-top:2px}
/* nationality breakdown */
.natrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.natc{width:150px;flex:0 0 auto;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nattrack{flex:1;height:16px;background:var(--dark);border-radius:4px;overflow:hidden}
.natfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--acc));border-radius:4px;min-width:2px}
.natn{width:86px;text-align:right;flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
/* ===== HLTV-style shell: fixed top bar, wide layout, sidebar, sticky tabs ===== */
body{padding-top:46px}
.topbar{position:fixed;top:0;left:0;right:0;height:46px;background:#12171c;border-bottom:1px solid #0a0e12;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tb-inner{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;gap:12px;padding:0 16px}
.tb-logo{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.tb-logo.ini{border-radius:5px;background:var(--pan2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--tx)}
.tb-name{font-weight:800;font-size:15px;letter-spacing:.3px}
.tb-name span{color:var(--mut);font-weight:600;font-size:11px;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:22px}
.tb-stat{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tb-stat b{color:var(--tx);font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums}
.tb-stat b.cash{color:var(--good)}
.tb-search{position:relative;margin-left:20px;flex:0 1 300px}
.tb-search input{width:100%;background:var(--dark);border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:7px 11px;font-size:12px;font-family:inherit}
.tb-search input:focus{outline:none;border-color:var(--blue)}
.gsres{display:none;position:absolute;top:38px;left:0;right:0;background:var(--pan);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-height:340px;overflow:auto;z-index:60}
.gsrow{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.gsrow:hover{background:var(--pan2)}
.gsrow img{width:24px;height:24px;object-fit:cover;object-position:top;border-radius:4px;flex:0 0 auto;background:#20272e}
.gsrow .gsi{width:24px;height:24px;flex:0 0 auto}
.gsrow .gsn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gsrow .gstag{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto}
th.srt-th:hover{color:var(--tx)}
.pzcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pzbar{flex:0 1 80px;height:8px;background:var(--dark);border-radius:3px;overflow:hidden}
.pzbar i{display:block;height:100%;background:linear-gradient(90deg,#c98a1e,var(--gold))}
.pzcell b{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:164px minmax(0,1fr) 288px;gap:14px;align-items:start}
.main{min-width:0}
.side{position:sticky;top:58px;display:flex;flex-direction:column;gap:12px}
/* left vertical navigation — every tab visible at once, no scroll, no wrapping */
.lnav{position:sticky;top:58px;display:flex;flex-direction:column;gap:2px;background:var(--pan);border-radius:9px;padding:7px}
.lnav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;white-space:nowrap;transition:background .12s,color .12s}
.lnav button .ti{font-size:15px;width:19px;text-align:center;flex:0 0 auto}
.lnav button:hover:not(.on){color:var(--tx);background:rgba(255,255,255,.05)}
.lnav button.on{background:var(--pan2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.swid{background:var(--pan);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.swid h4{margin:0;padding:10px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:var(--dark);border-bottom:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.srow:hover{background:var(--pan2)}
.srow .sr-rk{width:20px;color:var(--mut);font-weight:800;text-align:center;flex:0 0 auto}
.srow img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.srow .sr-ph{border-radius:4px;object-fit:cover;object-position:top;background:#dde2e7}
.srow .sr-ini{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;color:#1a1f24;flex:0 0 auto}
.srow .sr-ic{width:22px;text-align:center;flex:0 0 auto}
.srow .sr-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sr-fee{color:var(--gold);font-weight:700;font-size:12px;flex:0 0 auto}
.srow.more{justify-content:flex-end;color:var(--acc);font-size:11px;font-weight:600;border-bottom:none}
.srow.more:hover{color:var(--blue);background:transparent}
.tabs{position:sticky;top:46px;z-index:20;box-shadow:0 3px 8px rgba(0,0,0,.28)}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .lnav{position:static;order:1;flex-direction:row;flex-wrap:wrap}
 .lnav button{width:auto}
 .main{order:2}
 .side{position:static;order:3}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function _tip(events,label){if(!events||!events.length)return '';return '<span class="mvptip"><b>'+label+'</b>'+events.map(function(e){return '<span class="ev">🏆 '+esc(e)+'</span>';}).join('')+'</span>';}
// gold MVP coin with count; hover shows the tournament(s) it was won at
function mvpBadge(p,sz){if(!p||!p.mvp)return '';sz=sz||20;
 return '<span class="mvpb"><img class="mvpcoin" src="'+MVP_IMG+'" style="width:'+sz+'px;height:'+sz+'px">×'+p.mvp+_tip(p.mvpEvents,'MVP турниров')+'</span>';}
function evpBadge(p){if(!p||!p.evp)return '';
 return '<span class="mvpb evp">EVP ×'+p.evp+_tip(p.evpEvents,'EVP турниров')+'</span>';}
// Major MVP — MVP of an actual Valve Major (gold pill, HLTV-style)
function majorMvpBadge(p){if(!p||!p.majorMvp)return '';
 return '<span class="mmvp" title="'+esc((p.majorMvpEvents||[]).join(' • '))+'">🏆 Major MVP'+(p.majorMvp>1?' ×'+p.majorMvp:'')+'</span>';}
// HLTV-style Top-20-of-the-year badges. Colour by placement: gold #1, silver #2,
// bronze #3, copper #4-20. p.top20hist = [[year,rank],...].
function t20col(r){return r===1?['#ffe27a','#d9a520','#e8b93a','#5a4200']:r===2?['#eef2f6','#aab3be','#c3ccd6','#333a42']:r===3?['#eab06a','#a4642a','#c07d3c','#3e2510']:['#e0975a','#a05a28','#bf7238','#3a2210'];}
// Real in-game Top-20 medal (rank icon 1-20) with the actual year drawn onto its banner.
function t20badge(year,rank){var img=T20_ICONS[rank];
 if(!img){var c=t20col(rank);return '<svg viewBox="0 0 200 200" width="100%" height="100%" style="display:block"><rect x="46" y="46" width="108" height="108" rx="10" fill="'+c[1]+'"/><text x="100" y="122" text-anchor="middle" font-size="66" font-weight="900" fill="#161616">'+rank+'</text></svg>';}
 return '<svg viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible">'
 +'<image href="'+img+'" x="0" y="0" width="200" height="200"/>'
 +'<text x="100" y="48.5" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs" font-family="YrBlack,Arial,sans-serif" font-weight="700" font-size="30" fill="#171008" stroke="#171008" stroke-width="1" style="paint-order:stroke">'+year+'</text>'
 +'</svg>';}
// year-medals sized to sit inline with the trophy icons (same box as .mtrophy)
function top20Medals(p){var h=(p&&p.top20hist)||[];if(!h.length)return '';
 return h.slice().sort(function(a,b){return a[1]-b[1]||a[0]-b[0];}).map(function(x){
   return '<div class="mtrophy t20t" onclick=\'event.stopPropagation();openTop20Year('+x[0]+')\' title="Топ-20 '+x[0]+' года · #'+x[1]+' в мире">'+t20badge(x[0],x[1])+'</div>';}).join('');}
// compact HLTV "Top 20" row of clickable year-rank chips (#4 '16, #1 '18, ...)
function top20Row(p){var h=(p&&p.top20hist)||[];if(!h.length)return '';
 var chips=h.slice().sort(function(a,b){return a[0]-b[0];}).map(function(x){var c=t20col(x[1]);
   return '<span class="t20pill" style="background:linear-gradient(180deg,'+c[0]+','+c[1]+');color:'+c[3]+'" '
    +'onclick=\'event.stopPropagation();openTop20Year('+x[0]+')\' title="Топ-20 '+x[0]+' года — открыть">'
    +'#'+x[1]+"<i>'"+String(x[0]).slice(2)+'</i></span>';}).join('');
 return '<div class="t20row">'+chips+'</div>';}
// full-year Top-20 grid modal (who was which place that year, HLTV-style)
window.openTop20Year=function(year){var by=(D.top20_by_year||{})[year]||(D.top20_by_year||{})[String(year)];if(!by)return;
 var ranks=Object.keys(by).map(Number).sort(function(a,b){return a-b;});
 var cards=ranks.map(function(r){var nk=by[String(r)]||by[r];var p=P[nk]||{nick:nk};var src=photoURL(p)||SIL;
   return '<div class="toscard" onclick=\'openP('+JSON.stringify(nk)+')\'><div class="rk">#'+r+'</div>'
    +'<img class="ph" src="'+src+'" onerror="tcSil(this)"><div class="nk">'+(P[nk]?flag(p.country):'')+' '+esc(nk)+'</div></div>';}).join('');
 document.getElementById('mbox').innerHTML='<span class="close" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">×</span>'
  +'<h2 style="margin:0 0 2px;font-size:22px">Топ-20 игроков '+year+' года</h2>'
  +'<div style="color:var(--mut);font-size:12px;margin-bottom:16px">Рейтинг по версии EMTV</div>'

 var xs=function(i){return pad+i*(W-2*pad)/(vh.length-1);};
 var yv=function(v){return H-pad-(v/vmax)*(H-2*pad);};
 var yr=function(r){var sp=(rmax-rmin)||1;return H-pad-((r-rmin)/sp)*(H-2*pad);};
 var vpath=vh.map(function(x,i){return (i?'L':'M')+xs(i).toFixed(0)+' '+yv(x[1]).toFixed(0);}).join(' ');

const RGRP=[['Аим',[0,2,9]],['Реакция',[1,3]],['Клатч',[4,12]],['Тактика',[5,6,15]],['Энтри',[7,10]],['Саппорт',[8,13]],['Лидерство',[14,16]],['Стабильн.',[11,17,18,19]]];
function radarSVG(attrs){
 if(!attrs||!Object.keys(attrs).length)return '';
 const g=idx=>{let s=0,c=0;idx.forEach(i=>{const v=attrs[i];if(v!=null){s+=+v;c++;}});return c?s/c:0;};
 const axes=RGRP.map(([lab,idx])=>({lab,v:g(idx)})),N=axes.length,cx=130,cy=130,R=92,max=20;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 let rings='';[0.25,0.5,0.75,1].forEach(f=>{rings+='<polygon points="'+axes.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
 let spokes='',labels='';axes.forEach((ax,i)=>{const p=pt(i,R);spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--line)"/>';const l=pt(i,R+15);labels+='<text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'" fill="var(--mut)" font-size="10" text-anchor="middle" dominant-baseline="middle">'+ax.lab+'</text>';});
 const poly=axes.map((ax,i)=>pt(i,R*Math.min(1,ax.v/max)).map(n=>n.toFixed(1)).join(',')).join(' ');
 const dots=axes.map((ax,i)=>{const p=pt(i,R*Math.min(1,ax.v/max));return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--blue)"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" fill="var(--tx)" font-size="10" font-weight="700" text-anchor="middle">'+ax.v.toFixed(1)+'</text>';}).join('');
 return '<svg viewBox="0 0 260 260" style="width:100%;max-width:300px;height:auto;display:block;margin:4px auto">'+rings+spokes+'<polygon points="'+poly+'" fill="rgba(91,157,217,.28)" stroke="var(--blue)" stroke-width="2"/>'+dots+labels+'</svg>';}
// rating-over-matches development line
function devSVG(hist){
 if(!hist||hist.length<2)return '';
 const W=760,H=120,pad=18,min=Math.min.apply(null,hist),max=Math.max.apply(null,hist),span=(max-min)||1;
 const xs=i=>pad+i*(W-2*pad)/(hist.length-1),ys=v=>H-pad-(v-min)/span*(H-2*pad);
 const path=hist.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
 const area=path+' L'+xs(hist.length-1).toFixed(1)+' '+(H-pad)+' L'+pad+' '+(H-pad)+' Z';
 const avg=hist.reduce((a,b)=>a+b,0)/hist.length;
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><path d="'+area+'" fill="rgba(240,168,58,.12)"/><line x1="'+pad+'" y1="'+ys(avg).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+ys(avg).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/><path d="'+path+'" fill="none" stroke="var(--gold)" stroke-width="2.5"/>'+hist.map((v,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.5" fill="var(--acc)"/>').join('')+'</svg>';}

// make any <table> sortable by clicking a column header
function makeSortable(table){
 if(!table||table.__srt||!table.tHead)return;table.__srt=1;
 var ths=table.tHead.rows[0].cells;
 Array.prototype.forEach.call(ths,function(th,ci){
  th.classList.add('srt-th');th.style.cursor='pointer';var dir=1;
  th.onclick=function(e){if(e&&e.stopPropagation)e.stopPropagation();
   var tb=table.tBodies[0];if(!tb)return;var rows=Array.prototype.slice.call(tb.rows);
   var num=function(s){var m=(''+s).replace(/[^0-9.\-]/g,'');return (m===''||m==='-'||m==='.')?null:parseFloat(m);};
   rows.sort(function(a,b){var x=(a.cells[ci]?a.cells[ci].textContent:'').trim(),y=(b.cells[ci]?b.cells[ci].textContent:'').trim();var nx=num(x),ny=num(y);if(nx!=null&&ny!=null)return (nx-ny)*dir;return x.localeCompare(y,'ru')*dir;});
   dir=-dir;rows.forEach(function(r){tb.appendChild(r);});
  };
 });
}

// world-ranking development: rank over time (rank #1 at the top, inverted y-axis)

 const area=path+' L'+xs(ranks.length-1).toFixed(1)+' '+(H-pad)+' L'+pad+' '+(H-pad)+' Z';

window.openTour=function(name){var t=(D.tournaments||[]).find(function(x){return x.name===name;});if(!t)return;
 var ic=TICON(name),tl=function(x){return (D.logos||{})[x];};
 var _prz=(t.table||[]).map(function(r){return r.prize||0;});
 var _totalP=_prz.reduce(function(a,b){return a+b;},0),_maxP=Math.max.apply(null,_prz.concat([1]));
 var rows=(t.table||[]).map(function(r){var m=r.place===1?'🥇':r.place===2?'🥈':r.place===3?'🥉':'#'+r.place;
  return "<tr onclick='openT("+JSON.stringify(r.team)+")'><td style=\"text-align:center;font-size:15px\">"+m+"</td><td><div class=\"pcell\">"+(tl(r.team)?'<img class="rlogo" src="'+tl(r.team)+'">':'<div class="rlogo ini" style="background:'+col(r.team)+'">'+r.team.slice(0,2).toUpperCase()+'</div>')+"<span>"+r.team+"</span></div></td><td><div class=\"pzcell\"><div class=\"pzbar\"><i style=\"width:"+(r.prize?Math.round(r.prize/_maxP*100):0)+"%\"></i></div><b>"+(r.prize?fmt(r.prize):'—')+"</b></div></td><td>"+(r.pts||'—')+"</td></tr>";}).join('');
 var logoEl=ic?'<img class="mphoto" style="object-fit:contain;background:#20272e;padding:14px" src="'+ic+'">':'<div class="mphoto" style="background:var(--pan2);display:flex;align-items:center;justify-content:center;font-size:52px">🏆</div>';
 var RNAME={1:'Финал',2:'Полуфинал',4:'1/4 финала',8:'1/8 финала',16:'1/16 финала'};
 var brow=function(team,win){
   if(!team)return '<div class="brkr los"><span class="bn">—</span></div>';
   var lg=tl(team),img=lg?'<img src="'+lg+'">':'<div class="bini" style="background:'+col(team)+'">'+team.slice(0,2).toUpperCase()+'</div>';
   return '<div class="brkr '+(win?'win':'los')+'" style="cursor:pointer" onclick=\'event.stopPropagation();openT('+JSON.stringify(team)+')\'>'+img+'<span class="bn">'+team+'</span></div>';};
 var brk='';
 if(t.bracket&&t.bracket.length){
   var cols=t.bracket.map(function(rd){
     var hdr=RNAME[rd.length]||('Раунд · '+rd.length);
     var ms=rd.map(function(m){return '<div class="brkm">'+brow(m.a,m.wa)+brow(m.b,m.wb)+'</div>';}).join('');
     return '<div class="brkcol"><div class="brkh">'+hdr+'</div>'+ms+'</div>';}).join('');
   brk='<div class="statbox"><div class="sh">Сетка плей-офф</div><div class="brk">'+cols+'</div></div>';
 }
 // Swiss / group stage — real records, grouped by W-L (advanced green, out red)
 var sw='';
 if(t.swiss&&t.swiss.length){
   var grp={},ordr=[];
   t.swiss.forEach(function(r){var rec=r.w+'–'+r.l;if(!grp[rec]){grp[rec]=[];ordr.push(rec);}grp[rec].push(r);});
   var scols=ordr.map(function(rec){
     var rs=grp[rec],adv=rs[0].adv,elim=rs[0].elim;
     var hc=adv?'adv':(elim?'elim':''),mark=adv?' ✓':(elim?' ✕':'');
     var body=rs.map(function(r){var lg=tl(r.team),im=lg?'<img src="'+lg+'">':'<div class="bini" style="background:'+col(r.team)+'">'+r.team.slice(0,2).toUpperCase()+'</div>';
       return '<div class="swteam" onclick=\'event.stopPropagation();openT('+JSON.stringify(r.team)+')\'>'+im+'<span>'+r.team+'</span></div>';}).join('');
     return '<div class="swcol '+hc+'"><div class="swh '+hc+'">'+rec+mark+'</div>'+body+'</div>';}).join('');
   sw='<div class="statbox"><div class="sh">Швейцарская стадия <span>· '+t.swiss.length+' команд</span></div><div class="swgrid">'+scols+'</div></div>';
 }
 document.getElementById('mbox').innerHTML='<span class="close" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">×</span>'+
  '<div class="mhero" style="align-items:center">'+logoEl+
  '<div class="mheroinfo" style="flex:1;min-width:0"><div class="mname">'+name+'</div>'+
   (t.major?'<div style="margin-top:6px"><span class="mbadge" style="background:var(--gold)">MAJOR</span></div>':'')+
   '<div class="mreal" style="margin-top:6px">Плей-офф · '+((t.table||[]).length)+' команд</div>'+
   (t.mvp?'<div class="mreal" style="margin-top:4px">MVP: <b class="mvpcoin" style="color:var(--gold);cursor:pointer" onclick=\'event.stopPropagation();openP('+JSON.stringify(t.mvp)+')\'>'+t.mvp+'</b></div>':'')+
   '</div></div>'+
  brk+sw+
  '<div class="statbox"><div class="sh">Итоговая таблица'+(_totalP?' <span>· призовой фонд '+fmt(_totalP)+'</span>':'')+'</div><table><thead><tr><th>Место</th><th>Команда</th><th>Приз</th><th>Очки</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="color:var(--mut)">Нет данных</td></tr>')+'</tbody></table></div>';
 document.getElementById('modal').classList.add('on');};
// make ranked-team players + free agents clickable (basic card even without photo/stats)
(D.ranking||[]).forEach(function(t){(t.roster||[]).forEach(function(r){if(!P[r.nick])P[r.nick]={nick:r.nick,first:r.first||'',last:r.last||'',country:r.country,team:t.team,overall:r.overall,potential:0,age:r.age,attrs:{},stats:null};});});
(D.free_agents||[]).forEach(function(r){if(!P[r.nick])P[r.nick]={nick:r.nick,first:r.first||'',last:r.last||'',country:r.country,team:'',overall:r.overall,potential:0,age:r.age,value:r.value||0,role:r.role||'',attrs:{},stats:null};});
render();
try{ initSearch(); applySort(); sectionize(); }catch(e){}
// restore where you were after an automatic refresh (tab / scroll / open player card)
try{var _st=JSON.parse(sessionStorage.getItem('tc_state')||'null');
 if(_st){ if(_st.t)show(_st.t); if(_st.n&&P[_st.n])openP(_st.n); if(typeof _st.y==='number')window.scrollTo(0,_st.y); }
}catch(e){}
// Live polling — only active when the page is served from the localhost server.
(function(){
  var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  // real-time money + world rank (no reload needed)
  setInterval(function(){
    fetch('/live?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j) return;
      if(j.balance!=null){ set('liveCash', fmt(j.balance)); set('tbCash', fmt(j.balance)); }
      if(j.rank!=null){ set('lr1','#'+j.rank); set('lr2','#'+j.rank); set('tbRank','#'+j.rank); }
    }).catch(function(){});
  }, 3000);
  // Apply new data (after the game saves) AUTOMATICALLY — but never yank you mid-action.
  // We remember your tab / scroll / open card, refresh, and put you right back, so it
  // feels like a live update instead of a manual reload.
  var modalOpen=function(){var m=document.getElementById('modal');return !!(m&&m.classList.contains('on'));};
  function tcSave(){try{sessionStorage.setItem('tc_state',JSON.stringify({t:(window.__tcTab||'info'),y:Math.round(window.scrollY||0),n:modalOpen()?(window.__tcNick||null):null}));}catch(e){}}
  var lastAct=Date.now();
  ['click','keydown','wheel','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
  setInterval(tcSave,2000);
  var baseV=null, stale=false;
  fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){baseV=j.v;}).catch(function(){});
  function pill(on){var p=document.getElementById('refreshPill');
    if(on){ if(!p){p=document.createElement('div');p.id='refreshPill';p.innerHTML='🔄 обновляю…';p.onclick=function(){tcSave();location.reload();};document.body.appendChild(p);} }
    else if(p){p.remove();}
  }
  setInterval(function(){
    fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(baseV!=null && j && j.v && j.v!==baseV){ stale=true; }
    }).catch(function(){});
  }, 3000);
  // auto-apply loop: refresh by itself once you're not busy and no card is open
  setInterval(function(){
    if(!stale) return;
    pill(true);
    if(modalOpen()) return;                 // reading a player card -> wait
    if(Date.now()-lastAct < 4000) return;   // you just interacted -> wait a moment
    tcSave(); location.reload();
  }, 1200);
  // Live world Top-20 + Major-MVP — the moment EMTV announces a placement, the medal
  // pops in on the dashboard WITHOUT a page reload (updates in-memory + a toast).
  function toast(msg){var t=document.createElement('div');t.className='tctoast';t.innerHTML=msg;
    document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('on');});
    setTimeout(function(){t.classList.remove('on');setTimeout(function(){t.remove();},400);},6500);}
  function sameH(a,b){a=a||[];b=b||[];if(a.length!==b.length)return false;
    for(var i=0;i<a.length;i++){if(a[i][0]!==b[i][0]||a[i][1]!==b[i][1])return false;}return true;}
  setInterval(function(){
    fetch('/top20?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j)return;var t20=j.t20||{},mm=j.mmvp||{};
      Object.keys(t20).forEach(function(nk){var p=P[nk];if(!p)return;
        if(!sameH(p.top20hist,t20[nk])){
          var old=(p.top20hist||[]).map(function(x){return x[0]+'-'+x[1];});
          t20[nk].forEach(function(x){if(old.indexOf(x[0]+'-'+x[1])<0){toast('🏅 <b>'+nk+'</b> — №'+x[1]+' в Топ-20 мира '+x[0]+'!');}});
          p.top20hist=t20[nk];
          if(modalOpen()&&window.__tcNick===nk){openP(nk);}
        }});
      Object.keys(mm).forEach(function(nk){var p=P[nk];if(!p)return;
        if((p.majorMvp||0)!==(mm[nk].n||0)){
          if((mm[nk].n||0)>(p.majorMvp||0)){toast('🏆 <b>'+nk+'</b> — MVP мажора!');}
          p.majorMvp=mm[nk].n;p.majorMvpEvents=mm[nk].e;
          if(modalOpen()&&window.__tcNick===nk){openP(nk);}
        }});
    }).catch(function(){});
  }, 5000);
})();
