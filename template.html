<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TEAM__ — Team Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* palette taken 1:1 from hltv.org */
:root{--bg:#1a2129;--pan:#2d3844;--pan2:#364250;--dark:#232a30;--line:#3b4653;--tx:#dfe4e8;--mut:#929a9e;--acc:#87a3bf;--blue:#5b9dd9;--gold:#f0a83a;--good:#7ebd5a;--bad:#cd5b52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'Open Sans','Segoe UI',system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.panel{background:var(--pan);border-radius:6px;margin-bottom:10px;overflow:hidden}
.photos{display:flex;background:#1a1f24;padding:0}
.photos .pl{flex:1;position:relative;cursor:pointer;border-right:1px solid #0a1119;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.photos .pl:last-child{border:none}
.photos .pl img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.photos .av{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#1a1f24}
.photos .nm{position:relative;background:linear-gradient(transparent,rgba(6,12,18,.95));padding:22px 8px 8px;font-weight:700;display:flex;align-items:center;gap:6px;z-index:2}
.photos .pl:hover img.ph{transform:scale(1.04);transition:.2s}
.fl{font-size:14px;line-height:1}
.thead{display:flex;align-items:flex-start;gap:16px;padding:16px;position:relative;overflow:hidden}
.thead .bg{position:absolute;right:-30px;top:-30px;height:170px;opacity:.07;pointer-events:none}
.tlogo{width:96px;height:96px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;z-index:1}
.tlogo img{max-width:100%;max-height:100%}
.treg{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
h1{margin:2px 0 10px;font-size:30px;font-weight:800}
.socials{margin-left:auto;display:flex;gap:6px;z-index:1}
.socials a{width:34px;height:34px;border-radius:6px;background:var(--pan2);display:flex;align-items:center;justify-content:center;color:var(--mut);text-decoration:none;font-size:14px}
.ranks{display:flex;gap:30px;margin-top:2px}
.ranks .r{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.ranks .r b{color:var(--tx);font-size:15px}
.inforow{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:13px}

.trophies{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.trophy{width:40px;height:46px;background:var(--pan2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;padding:4px}.trophy img{max-width:100%;max-height:100%;object-fit:contain}.tpl{position:absolute;bottom:-2px;right:-2px;background:#1a1f24;border-radius:3px;font-size:9px;padding:1px 4px;color:var(--mut)}
.tabs{display:flex;background:var(--pan);border-radius:6px;margin-bottom:10px;overflow:hidden;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--mut);padding:13px 18px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--pan2);color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
sec{display:none}sec.on{display:block}
.box{background:var(--pan);border-radius:6px;padding:16px;margin-bottom:10px;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.chartkpis{display:flex;gap:40px;margin-bottom:10px}
.chartkpis .c b{font-size:20px}.chartkpis .c span{color:var(--mut);font-size:11px;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:600;cursor:pointer}th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--pan2)}
.pcell{display:flex;align-items:center;gap:9px}.pcell .av{width:30px;height:30px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#1a1f24}
.pcell .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.sub{color:var(--mut);font-size:11px}
input.search{width:100%;max-width:300px;background:#232a30;border:1px solid var(--line);border-radius:5px;color:var(--tx);padding:8px 11px;margin-bottom:12px}
.sc{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}.win{color:var(--good)}.lose{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.on{display:flex}.mbox{background:var(--pan);border:1px solid var(--line);border-radius:10px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.close{float:right;cursor:pointer;color:var(--mut);font-size:22px;position:relative;z-index:2}
.mhero{display:flex;gap:16px;align-items:flex-end;background:linear-gradient(180deg,#232a30,var(--pan));margin:-20px -20px 4px;padding:18px 20px;position:relative;overflow:hidden}
.mhero .hbg{position:absolute;right:-15px;top:-20px;height:170px;opacity:.13;pointer-events:none}
.mphoto{width:168px;height:196px;border-radius:8px;object-fit:cover;object-position:top;flex:0 0 auto;position:relative;z-index:1}.mheroinfo{padding-bottom:6px;position:relative;z-index:1}
.mhero .hbg{height:210px}
.ov{background:var(--pan2);border-radius:6px;padding:3px 9px;font-weight:800;color:var(--gold)}
.kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.kpis4 .c{background:var(--pan2);border-radius:6px;padding:10px}.kpis4 .c span{color:var(--mut);font-size:11px}.kpis4 .c b{display:block;font-size:19px}
.attgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px}
.att .lab{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}.att .lab b{color:var(--tx)}
.bar{height:6px;background:#232a30;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.foot{color:var(--mut);font-size:11px;text-align:center;padding:16px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.achcard{display:flex;gap:12px;align-items:center;background:var(--pan2);border-radius:6px;padding:10px}.achimg{width:52px;height:52px;border-radius:6px;background:#1a1f24;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;padding:5px}.achimg img{max-width:100%;max-height:100%;object-fit:contain}
.staffrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sbcard{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
.sbhead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--pan2)}
.sbhead:hover{background:#3e4b5a}
.sbbody{display:none;padding:6px 14px 12px}.sbbody.open{display:block}
.sbteam{font-size:11px;text-transform:uppercase;color:var(--mut);margin:10px 0 4px;letter-spacing:.5px}
.sbtab th,.sbtab td{padding:6px 8px}
.photos .pl{transition:.15s}.photos .pl:hover{filter:brightness(1.12)}
.trophy:hover{background:#3e4b5a}
.rlist{max-height:620px;overflow:auto}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--pan2)}
.rrow.me{background:linear-gradient(90deg,rgba(91,157,217,.18),transparent);box-shadow:inset 3px 0 0 var(--acc)}
.rrow .rk{width:44px;font-weight:800;color:var(--mut);font-size:15px}
.rrow.me .rk{color:var(--acc)}
.rrow .rt{flex:1;min-width:0}.rrow .rt b{font-size:14px}
.rrow .rt .rr{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rlogo{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.rrow .rlogo.ini{border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#1a1f24}
.mname{font-size:26px;font-weight:800;line-height:1.1}
.mreal{color:var(--mut);margin-top:3px;font-size:13px}
.mact{position:absolute;top:16px;right:16px;display:flex;gap:6px;z-index:3}
.mact a{width:30px;height:26px;border-radius:4px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#cdd4da;font-size:13px;text-decoration:none}
.minfo{width:100%;border-collapse:collapse;margin-top:2px}
.minfo td{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
.minfo tr:last-child td{border-bottom:none}
.minfo td:first-child{color:var(--mut);width:42%}
.minfo td:last-child{text-align:right;color:var(--tx);font-weight:600}
.itlogo{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.fl{width:21px;height:15px;border-radius:2px;object-fit:cover;vertical-align:-2px;margin-right:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.fl.sm{width:17px;height:12px;vertical-align:-1px;margin-right:3px}
.mbadges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;color:#1a1f24;white-space:nowrap}
.mtrophies{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 4px}
.mtrophy{width:46px;height:52px;border-radius:5px;background:var(--pan2);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:inset 0 0 0 1px var(--line)}
.mtrophy img{width:36px;height:40px;object-fit:contain}
.mtrophy.maj{box-shadow:inset 0 0 0 2px var(--gold);background:#39321d}
.statbox{background:var(--dark);border-radius:8px;padding:14px 16px;margin-top:12px}
.statbox .sh{font-size:13px;font-weight:700;margin-bottom:12px}.statbox .sh span{color:var(--mut);font-weight:400;font-size:11px}
.brk{display:flex;gap:20px;overflow-x:auto;padding:4px 2px 6px}
.brkcol{display:flex;flex-direction:column;justify-content:space-around;min-width:168px;gap:12px}
.brkh{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;text-align:center;padding-bottom:2px}
.brkm{background:var(--pan2);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.brkr{display:flex;align-items:center;gap:7px;padding:6px 9px;border-left:3px solid transparent;font-size:12px;color:var(--mut)}
.brkr+.brkr{border-top:1px solid var(--line)}
.brkr img{width:18px;height:18px;object-fit:contain;flex:0 0 auto}
.brkr .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brkr.win{border-left-color:#4ba85a;color:#fff;font-weight:600}
.brkr.los{border-left-color:#b7413a}
.brkr .bini{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex:0 0 auto}
.rtag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.fbar{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 10px}
.fpill{min-width:34px;text-align:center;font-size:11px;font-weight:700;color:#fff;padding:4px 7px;border-radius:5px;cursor:pointer}
.fpill.w{background:#2f7d43}.fpill.l{background:#a33b34}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.flt select,.flt input{background:var(--dark);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit}
.finrow{display:flex;align-items:center;gap:10px;margin:5px 0}
.finrow .lab{width:150px;color:var(--mut);font-size:12px;flex:0 0 auto}
.finrow .track{flex:1;height:16px;background:var(--dark);border-radius:4px;overflow:hidden}
.finrow .fill{height:100%;border-radius:4px}
.finrow .amt{width:110px;text-align:right;font-weight:700;font-size:12px;flex:0 0 auto}
.calrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;background:var(--pan2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.calrow .tbadge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;flex:0 0 auto;letter-spacing:.4px}
.tb-major{background:var(--gold);color:#1a1206}.tb-t1{background:#4b7bd6;color:#fff}.tb-t2{background:#586070;color:#fff}
.calrow .cinfo{flex:1;min-width:0}
.calrow .cinfo b{font-size:14px}
.calrow .cmeta{color:var(--mut);font-size:11.5px;margin-top:2px}
.cbcard{display:inline-flex;flex-direction:column;align-items:center;gap:8px;width:120px;padding:14px 8px;border-radius:10px;background:var(--pan2);box-shadow:inset 0 0 0 1px var(--line);margin:0 8px 12px 0;vertical-align:top;cursor:pointer}
.cbcard.maj{box-shadow:inset 0 0 0 2px var(--gold);background:#2b2512}
.cbcard img{width:64px;height:64px;object-fit:contain}
.cbcard .cbn{font-size:11px;font-weight:600;text-align:center;line-height:1.25}
/* player of the patch */
.potw{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#2b2512,var(--pan2));border-radius:8px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--gold);cursor:pointer}
.potw .pimg{width:62px;height:72px;border-radius:6px;object-fit:cover;object-position:top;flex:0 0 auto;background:#dde2e7}
.potw .pmid{flex:1;min-width:0}
.potw .plbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);font-weight:800}
.potw .pnk{font-size:20px;font-weight:800;margin:2px 0}
.potw .psub{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.potw .pbig{text-align:center;flex:0 0 auto}
.potw .pbig b{font-size:30px;font-weight:800;color:var(--gold);display:block;line-height:1}
.potw .pbig span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
/* form tiles with opponent logos */
.ftiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ftile{flex:1;min-width:76px;max-width:118px;background:var(--pan2);border-radius:7px;padding:10px 6px;text-align:center;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.ftile img{width:34px;height:34px;object-fit:contain;margin:0 auto 6px;display:block}
.ftile .fini{width:34px;height:34px;border-radius:5px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#1a1f24}
.ftile .fon{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .fsc{font-size:11px;color:var(--tx);margin-top:1px;font-weight:700}
.ftile .fres{margin-top:6px;font-size:10px;font-weight:800;padding:2px 0;border-radius:4px;color:#fff}
.ftile .fres.w{background:#2f7d43}.ftile .fres.l{background:#a33b34}
/* map win statistics */
.maprow{display:flex;align-items:center;gap:10px;margin:6px 0}
.maprow .mn{width:92px;flex:0 0 auto;font-weight:700;font-size:12.5px}
.maprow .mtrack{flex:1;height:20px;background:var(--dark);border-radius:4px;overflow:hidden}
.maprow .mfill{height:100%;border-radius:4px;min-width:2px}
.maprow .mpct{width:96px;text-align:right;flex:0 0 auto;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.maprow .mpct span{color:var(--mut);font-weight:400;font-size:11px}
/* transfer cards */
.trfcards{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}
.trfcard{flex:0 0 auto;width:206px;background:var(--pan2);border-radius:8px;padding:12px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.trfcard .th{display:flex;align-items:center;gap:9px}
.trfcard .tph{width:40px;height:46px;border-radius:5px;object-fit:cover;object-position:top;flex:0 0 auto;background:#dde2e7}
.trfcard .tnk{font-weight:700;font-size:14px}
.trfcard .tmove{display:flex;align-items:center;justify-content:center;gap:10px;margin:11px 0 9px}
.trfcard .tmove img{width:30px;height:30px;object-fit:contain}
.trfcard .tmove .tini{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#1a1f24}
.trfcard .tmove .arr{color:var(--gold);font-size:18px;font-weight:800}
.trfcard .tfee{text-align:center;font-weight:800;color:var(--gold);font-size:15px}

<script>
const D=__DATA__;
const ATTN=["Аим","Реакция","Спрей","Мувмент","Клатч","Позиционка","Гейм-сенс","Энтри","Саппорт","Снайпинг","Граната","Стабильность","Хладнокровие","Тимплей","Лидерство","Дисциплина","Опыт","Стамина","Адаптация","Мораль"];
const my=D.my_team, T=D.team||{};
const P=D.players;
const roster=D.roster_nicks.map(n=>P[n]).filter(Boolean).sort((a,b)=>(b.overall||0)-(a.overall||0));
const photo=n=>(D.photos||{})[n];
const col=n=>['#5b9dd9','#f0a83a','#7ebd5a','#b06cff','#d9534f'][((n||'?').charCodeAt(0))%5];
// when served from the localhost plugin server we can pull ANY player's photo on demand
const SERVED=location.protocol.indexOf('http')===0;
const ini=p=>((p&&p.nick)||'?').slice(0,2).toUpperCase();
function photoURL(p){if(!p)return '';const e=(D.photos||{})[p.nick];if(e)return e;
 if(SERVED&&p.nick)return '/photo?nick='+encodeURIComponent(p.nick)+'&first='+encodeURIComponent(p.first||'')+'&last='+encodeURIComponent(p.last||'');
 return '';}
// generic "no photo" silhouette used whenever a player's photo is missing/unavailable

 const rows=Object.entries(agg).map(([m,a])=>({m,w:a.w,n:a.n,pct:a.w/a.n}));
 rows.sort((x,y)=>{if(x.m==='__other')return 1;if(y.m==='__other')return -1;return y.pct-x.pct||y.n-x.n;});

const RGRP=[['Аим',[0,2,9]],['Реакция',[1,3]],['Клатч',[4,12]],['Тактика',[5,6,15]],['Энтри',[7,10]],['Саппорт',[8,13]],['Лидерство',[14,16]],['Стабильн.',[11,17,18,19]]];
function radarSVG(attrs){
 if(!attrs||!Object.keys(attrs).length)return '';
 const g=idx=>{let s=0,c=0;idx.forEach(i=>{const v=attrs[i];if(v!=null){s+=+v;c++;}});return c?s/c:0;};
 const axes=RGRP.map(([lab,idx])=>({lab,v:g(idx)})),N=axes.length,cx=130,cy=130,R=92,max=20;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 let rings='';[0.25,0.5,0.75,1].forEach(f=>{rings+='<polygon points="'+axes.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
 let spokes='',labels='';axes.forEach((ax,i)=>{const p=pt(i,R);spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--line)"/>';const l=pt(i,R+15);labels+='<text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'" fill="var(--mut)" font-size="10" text-anchor="middle" dominant-baseline="middle">'+ax.lab+'</text>';});
 const poly=axes.map((ax,i)=>pt(i,R*Math.min(1,ax.v/max)).map(n=>n.toFixed(1)).join(',')).join(' ');
 const dots=axes.map((ax,i)=>{const p=pt(i,R*Math.min(1,ax.v/max));return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--blue)"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" fill="var(--tx)" font-size="10" font-weight="700" text-anchor="middle">'+ax.v.toFixed(1)+'</text>';}).join('');
 return '<svg viewBox="0 0 260 260" style="width:100%;max-width:300px;height:auto;display:block;margin:4px auto">'+rings+spokes+'<polygon points="'+poly+'" fill="rgba(91,157,217,.28)" stroke="var(--blue)" stroke-width="2"/>'+dots+labels+'</svg>';}

function devSVG(hist){
 if(!hist||hist.length<2)return '';
 const W=760,H=120,pad=18,min=Math.min.apply(null,hist),max=Math.max.apply(null,hist),span=(max-min)||1;
 const xs=i=>pad+i*(W-2*pad)/(hist.length-1),ys=v=>H-pad-(v-min)/span*(H-2*pad);
 const path=hist.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
 const area=path+' L'+xs(hist.length-1).toFixed(1)+' '+(H-pad)+' L'+pad+' '+(H-pad)+' Z';
 const avg=hist.reduce((a,b)=>a+b,0)/hist.length;
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><path d="'+area+'" fill="rgba(240,168,58,.12)"/><line x1="'+pad+'" y1="'+ys(avg).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+ys(avg).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/><path d="'+path+'" fill="none" stroke="var(--gold)" stroke-width="2.5"/>'+hist.map((v,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.5" fill="var(--acc)"/>').join('')+'</svg>';}

   '<div class="mname">'+full+(team===my?' <span class="ov" style="color:var(--acc)">вы</span>':'')+'</div>'+
   '<div class="mreal">'+flag(country)+' '+(country||'')+'</div>'+
   '<table class="minfo">'+
    '<tr><td>Мировой рейтинг</td><td>'+(t?'#'+t.rank:'—')+'</td></tr>'+
    '<tr><td>Игроков в составе</td><td>'+(((t&&t.roster)||[]).length)+'</td></tr>'+
    (badges?'<tr><td>Награды</td><td><div class="mbadges">'+badges+'</div></td></tr>':'')+
   '</table>'+
  '</div></div>'+trophies+
  '<div class="statbox"><div class="sh">Состав</div><table><thead><tr><th>Игрок</th><th>Возр.</th><th>Овр</th></tr></thead><tbody>'+(rosterRows||'<tr><td colspan="3" style="color:var(--mut)">Нет данных о составе</td></tr>')+'</tbody></table></div>';
 document.getElementById('modal').classList.add('on');};
// tournament page: final standings, prize money, points, majors
window.openTour=function(name){var t=(D.tournaments||[]).find(function(x){return x.name===name;});if(!t)return;
 var ic=TICON(name),tl=function(x){return (D.logos||{})[x];};
 var rows=(t.table||[]).map(function(r){var m=r.place===1?'🥇':r.place===2?'🥈':r.place===3?'🥉':'#'+r.place;
  return "<tr onclick='openT("+JSON.stringify(r.team)+")'><td style=\"text-align:center;font-size:15px\">"+m+"</td><td><div class=\"pcell\">"+(tl(r.team)?'<img class="rlogo" src="'+tl(r.team)+'">':'<div class="rlogo ini" style="background:'+col(r.team)+'">'+r.team.slice(0,2).toUpperCase()+'</div>')+"<span>"+r.team+"</span></div></td><td>"+(r.prize?fmt(r.prize):'—')+"</td><td>"+(r.pts||'—')+"</td></tr>";}).join('');
 var logoEl=ic?'<img class="mphoto" style="object-fit:contain;background:#20272e;padding:14px" src="'+ic+'">':'<div class="mphoto" style="background:var(--pan2);display:flex;align-items:center;justify-content:center;font-size:52px">🏆</div>';
 var RNAME={1:'Финал',2:'Полуфинал',4:'1/4 финала',8:'1/8 финала',16:'1/16 финала'};
 var brow=function(team,win){
   if(!team)return '<div class="brkr los"><span class="bn">—</span></div>';
   var lg=tl(team),img=lg?'<img src="'+lg+'">':'<div class="bini" style="background:'+col(team)+'">'+team.slice(0,2).toUpperCase()+'</div>';
   return '<div class="brkr '+(win?'win':'los')+'" style="cursor:pointer" onclick=\'event.stopPropagation();openT('+JSON.stringify(team)+')\'>'+img+'<span class="bn">'+team+'</span></div>';};
 var brk='';
 if(t.bracket&&t.bracket.length){
   var cols=t.bracket.map(function(rd){
     var hdr=RNAME[rd.length]||('Раунд · '+rd.length);
     var ms=rd.map(function(m){return '<div class="brkm">'+brow(m.a,m.wa)+brow(m.b,m.wb)+'</div>';}).join('');
     return '<div class="brkcol"><div class="brkh">'+hdr+'</div>'+ms+'</div>';}).join('');
   brk='<div class="statbox"><div class="sh">Сетка плей-офф <span>· реконструкция по финальным местам</span></div><div class="brk">'+cols+'</div></div>';
 }
 document.getElementById('mbox').innerHTML='<span class="close" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">×</span>'+
  '<div class="mhero" style="align-items:center">'+logoEl+
  '<div class="mheroinfo" style="flex:1;min-width:0"><div class="mname">'+name+'</div>'+
   (t.major?'<div style="margin-top:6px"><span class="mbadge" style="background:var(--gold)">MAJOR</span></div>':'')+
   '<div class="mreal" style="margin-top:6px">Участников: '+((t.table||[]).length)+'</div></div></div>'+
  brk+
  '<div class="statbox"><div class="sh">Итоговая таблица</div><table><thead><tr><th>Место</th><th>Команда</th><th>Приз</th><th>Очки</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="color:var(--mut)">Нет данных</td></tr>')+'</tbody></table></div>';
 document.getElementById('modal').classList.add('on');};
// make ranked-team players + free agents clickable (basic card even without photo/stats)
(D.ranking||[]).forEach(function(t){(t.roster||[]).forEach(function(r){if(!P[r.nick])P[r.nick]={nick:r.nick,first:r.first||'',last:r.last||'',country:r.country,team:t.team,overall:r.overall,potential:0,age:r.age,attrs:{},stats:null};});});
(D.free_agents||[]).forEach(function(r){if(!P[r.nick])P[r.nick]={nick:r.nick,first:r.first||'',last:r.last||'',country:r.country,team:'',overall:r.overall,potential:0,age:r.age,value:r.value||0,role:r.role||'',attrs:{},stats:null};});
render();
// Live polling — only active when the page is served from the localhost server.
(function(){
  var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  setInterval(function(){
    fetch('/live?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j) return;
      if(j.balance!=null) set('liveCash', fmt(j.balance));
      if(j.rank!=null){ set('lr1','#'+j.rank); set('lr2','#'+j.rank); }
    }).catch(function(){});
  }, 3000);
  var baseV=null;
  fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){baseV=j.v;}).catch(function(){});
  setInterval(function(){
    fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(baseV!=null && j && j.v && j.v!==baseV) location.reload();
    }).catch(function(){});
  }, 2000);
})();
</script></body></html>
