<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TEAM__ — Team Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* palette taken 1:1 from hltv.org */
:root{--bg:#1a2129;--pan:#2d3844;--pan2:#364250;--dark:#232a30;--line:#3b4653;--tx:#dfe4e8;--mut:#929a9e;--acc:#87a3bf;--blue:#5b9dd9;--gold:#f0a83a;--good:#7ebd5a;--bad:#cd5b52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'Open Sans','Segoe UI',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.panel{background:var(--pan);border-radius:6px;margin-bottom:10px;overflow:hidden}
.photos{display:flex;background:#1a1f24;padding:0}
.photos .pl{flex:1;position:relative;cursor:pointer;border-right:1px solid #0a1119;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.photos .pl:last-child{border:none}
.photos .pl img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.photos .av{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#1a1f24}
.photos .nm{position:relative;background:linear-gradient(transparent,rgba(6,12,18,.95));padding:22px 8px 8px;font-weight:700;display:flex;align-items:center;gap:6px;z-index:2}
.photos .pl:hover img.ph{transform:scale(1.04);transition:.2s}
.fl{font-size:14px;line-height:1}
.thead{display:flex;align-items:flex-start;gap:16px;padding:16px;position:relative;overflow:hidden}
.thead .bg{position:absolute;right:-30px;top:-30px;height:170px;opacity:.07;pointer-events:none}
.tlogo{width:96px;height:96px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;z-index:1}
.tlogo img{max-width:100%;max-height:100%}
.treg{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
h1{margin:2px 0 10px;font-size:30px;font-weight:800}
.socials{margin-left:auto;display:flex;gap:6px;z-index:1}
.socials a{width:34px;height:34px;border-radius:6px;background:var(--pan2);display:flex;align-items:center;justify-content:center;color:var(--mut);text-decoration:none;font-size:14px}
.ranks{display:flex;gap:30px;margin-top:2px}
.ranks .r{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.ranks .r b{color:var(--tx);font-size:15px}
.inforow{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:13px}
.inforow .k{color:var(--tx)}.inforow .v{color:var(--mut);display:flex;align-items:center;gap:6px}
.trophies{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.trophy{width:40px;height:46px;background:var(--pan2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;padding:4px}.trophy img{max-width:100%;max-height:100%;object-fit:contain}.tpl{position:absolute;bottom:-2px;right:-2px;background:#1a1f24;border-radius:3px;font-size:9px;padding:1px 4px;color:var(--mut)}
.tabs{display:flex;gap:3px;background:var(--pan);border-radius:8px;margin-bottom:10px;padding:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tabs button{background:none;border:none;color:var(--mut);padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;transition:background .12s,color .12s}
.tabs button .ti{font-size:13px;opacity:.85}
.tabs button:hover:not(.on){color:var(--tx);background:rgba(255,255,255,.05)}
.tabs button.on{background:var(--pan2);color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
sec{display:none}sec.on{display:block}
.box{background:var(--pan);border-radius:6px;padding:16px;margin-bottom:10px;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.chartkpis{display:flex;gap:40px;margin-bottom:10px}
.chartkpis .c b{font-size:20px}.chartkpis .c span{color:var(--mut);font-size:11px;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:600;cursor:pointer}th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--pan2)}
.pcell{display:flex;align-items:center;gap:9px}.pcell .av{width:30px;height:30px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#1a1f24}
.pcell .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.sub{color:var(--mut);font-size:11px}
input.search{width:100%;max-width:300px;background:#232a30;border:1px solid var(--line);border-radius:5px;color:var(--tx);padding:8px 11px;margin-bottom:12px}
.sc{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}.win{color:var(--good)}.lose{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
#refreshPill{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1f24;font-weight:800;font-size:13px;padding:11px 20px;border-radius:24px;cursor:pointer;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:rpin .25s ease}
#refreshPill:hover{filter:brightness(1.08)}
@keyframes rpin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.modal.on{display:flex}.mbox{background:var(--pan);border:1px solid var(--line);border-radius:10px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.close{float:right;cursor:pointer;color:var(--mut);font-size:22px;position:relative;z-index:2}
.mhero{display:flex;gap:16px;align-items:flex-end;background:linear-gradient(180deg,#232a30,var(--pan));margin:-20px -20px 4px;padding:18px 20px;position:relative;overflow:hidden}
.mhero .hbg{position:absolute;right:-15px;top:-20px;height:170px;opacity:.13;pointer-events:none}
.mphoto{width:168px;height:196px;border-radius:8px;object-fit:cover;object-position:top;flex:0 0 auto;position:relative;z-index:1}.mheroinfo{padding-bottom:6px;position:relative;z-index:1}
.mhero .hbg{height:210px}
.ov{background:var(--pan2);border-radius:6px;padding:3px 9px;font-weight:800;color:var(--gold)}
.segbar{display:inline-flex;gap:2px;background:var(--dark);border-radius:7px;padding:3px;margin:10px 0 6px}
.seg{background:none;border:none;color:var(--mut);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;border-radius:5px;font-family:inherit;white-space:nowrap}
.seg.on{background:var(--gold);color:#1a1f24}
.segpane{display:none}.segpane.on{display:block}
#statModeSeg{display:inline-flex;gap:2px;background:var(--dark);border-radius:7px;padding:3px}
#statModeSeg button{background:none;border:none;color:var(--mut);padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;border-radius:5px;font-family:inherit}
#statModeSeg button.on{background:var(--gold);color:#1a1f24}
/* in-section sub-tab chips: show one block at a time, no long scroll */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:52px;z-index:15;background:var(--bg);padding:4px 0}
.subnav .subchip{background:var(--pan);border:1px solid var(--line);color:var(--mut);padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:20px;font-family:inherit;white-space:nowrap;transition:all .12s}
.subnav .subchip:hover{color:var(--tx);border-color:var(--mut)}
.subnav .subchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* Team of Season + Top-20 + Hall of Fame */
.tos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.toscard{background:var(--pan2);border-radius:9px;padding:12px 10px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.toscard:hover{background:#3a4653}
.toscard .rk{position:absolute;top:6px;left:8px;font-size:11px;font-weight:800;color:var(--gold)}
.toscard img.ph{width:74px;height:86px;border-radius:6px;object-fit:cover;object-position:top;background:#dde2e7}
.toscard .nk{font-weight:800;margin-top:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toscard .rt{color:var(--gold);font-weight:800;font-size:17px;margin-top:2px}
.toscard .rl{color:var(--mut);font-size:10px;margin-top:2px}
@media(max-width:760px){.tos{grid-template-columns:repeat(2,1fr)}}
.hofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.hofcard{background:linear-gradient(160deg,#2a2015,#20272e);border-radius:10px;padding:14px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px #4a3d28}
.hofcard:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.hofcard .av{width:68px;height:80px;border-radius:8px;margin:0 auto;overflow:hidden;background:#20272e}
.hofcard .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.hofcard .hn{font-weight:800;margin-top:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hofcard .hs{color:var(--gold);font-size:11px;margin-top:3px;font-weight:700}
.hofbadge{display:inline-block;background:linear-gradient(90deg,#b8912f,#e8c368);color:#1a1f24;font-weight:800;font-size:10px;padding:3px 9px;border-radius:11px;letter-spacing:.5px}
.hofhero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#33270f,#1a1f24 72%);border-radius:12px;padding:20px;border:1px solid #5a4826}
.hofhero .hbig{width:118px;height:138px;border-radius:10px;object-fit:cover;object-position:top;background:#20272e;flex:0 0 auto}
.hofstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.hofstat .c{background:var(--pan2);border-radius:7px;padding:10px;text-align:center}
.hofstat .c b{display:block;font-size:20px;color:var(--gold)}.hofstat .c span{font-size:11px;color:var(--mut)}
.kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.kpis4 .c{background:var(--pan2);border-radius:6px;padding:10px}.kpis4 .c span{color:var(--mut);font-size:11px}.kpis4 .c b{display:block;font-size:19px}
.attgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px}
.att .lab{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}.att .lab b{color:var(--tx)}
.bar{height:6px;background:#232a30;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.foot{color:var(--mut);font-size:11px;text-align:center;padding:16px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.achcard{display:flex;gap:12px;align-items:center;background:var(--pan2);border-radius:6px;padding:10px}.achimg{width:52px;height:52px;border-radius:6px;background:#1a1f24;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;padding:5px}.achimg img{max-width:100%;max-height:100%;object-fit:contain}
.staffrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sbcard{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
.sbhead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--pan2)}
.sbhead:hover{background:#3e4b5a}
.sbbody{display:none;padding:6px 14px 12px}.sbbody.open{display:block}
.sbteam{font-size:11px;text-transform:uppercase;color:var(--mut);margin:10px 0 4px;letter-spacing:.5px}
.sbtab th,.sbtab td{padding:6px 8px}
.photos .pl{transition:.15s}.photos .pl:hover{filter:brightness(1.12)}
.trophy:hover{background:#3e4b5a}
.rlist{max-height:620px;overflow:auto}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--pan2)}
.rrow.me{background:linear-gradient(90deg,rgba(91,157,217,.18),transparent);box-shadow:inset 3px 0 0 var(--acc)}
.rrow .rk{width:44px;font-weight:800;color:var(--mut);font-size:15px}
.rrow.me .rk{color:var(--acc)}
.rrow .rt{flex:1;min-width:0}.rrow .rt b{font-size:14px}
.rrow .rt .rr{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rlogo{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.rrow .rlogo.ini{border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#1a1f24}
.mname{font-size:26px;font-weight:800;line-height:1.1}
.mreal{color:var(--mut);margin-top:3px;font-size:13px}
.mact{position:absolute;top:16px;right:16px;display:flex;gap:6px;z-index:3}
.mact a{width:30px;height:26px;border-radius:4px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#cdd4da;font-size:13px;text-decoration:none}
.minfo{width:100%;border-collapse:collapse;margin-top:2px}
.minfo td{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
.minfo tr:last-child td{border-bottom:none}
.minfo td:first-child{color:var(--mut);width:42%}
.minfo td:last-child{text-align:right;color:var(--tx);font-weight:600}
.itlogo{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.fl{width:21px;height:15px;border-radius:2px;object-fit:cover;vertical-align:-2px;margin-right:4px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.fl.sm{width:17px;height:12px;vertical-align:-1px;margin-right:3px}
.mbadges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;color:#1a1f24;white-space:nowrap}
.mtrophies{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 4px}
.mtrophy{width:46px;height:52px;border-radius:5px;background:var(--pan2);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:inset 0 0 0 1px var(--line)}
.mtrophy img{width:36px;height:40px;object-fit:contain}
.mtrophy.maj{box-shadow:inset 0 0 0 2px var(--gold);background:#39321d}
.statbox{background:var(--dark);border-radius:8px;padding:14px 16px;margin-top:12px}
.statbox .sh{font-size:13px;font-weight:700;margin-bottom:12px}.statbox .sh span{color:var(--mut);font-weight:400;font-size:11px}
.brk{display:flex;gap:20px;overflow-x:auto;padding:4px 2px 6px}
.brkcol{display:flex;flex-direction:column;justify-content:space-around;min-width:168px;gap:12px}
.brkh{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;text-align:center;padding-bottom:2px}
.brkm{background:var(--pan2);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.brkr{display:flex;align-items:center;gap:7px;padding:6px 9px;border-left:3px solid transparent;font-size:12px;color:var(--mut)}
.brkr+.brkr{border-top:1px solid var(--line)}
.brkr img{width:18px;height:18px;object-fit:contain;flex:0 0 auto}
.brkr .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brkr.win{border-left-color:#4ba85a;color:#fff;font-weight:600}
.brkr.los{border-left-color:#b7413a}
.brkr .bini{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex:0 0 auto}
.rtag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.fbar{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 10px}
.fpill{min-width:34px;text-align:center;font-size:11px;font-weight:700;color:#fff;padding:4px 7px;border-radius:5px;cursor:pointer}
.fpill.w{background:#2f7d43}.fpill.l{background:#a33b34}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.flt select,.flt input{background:var(--dark);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit}
.finrow{display:flex;align-items:center;gap:10px;margin:5px 0}
.finrow .lab{width:150px;color:var(--mut);font-size:12px;flex:0 0 auto}
.finrow .track{flex:1;height:16px;background:var(--dark);border-radius:4px;overflow:hidden}
.finrow .fill{height:100%;border-radius:4px}
.finrow .amt{width:110px;text-align:right;font-weight:700;font-size:12px;flex:0 0 auto}
.calrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;background:var(--pan2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.calrow .tbadge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;flex:0 0 auto;letter-spacing:.4px}
.tb-major{background:var(--gold);color:#1a1206}.tb-t1{background:#4b7bd6;color:#fff}.tb-t2{background:#586070;color:#fff}
.calrow .cinfo{flex:1;min-width:0}
.calrow .cinfo b{font-size:14px}
.calrow .cmeta{color:var(--mut);font-size:11.5px;margin-top:2px}
.cbcard{display:inline-flex;flex-direction:column;align-items:center;gap:8px;width:120px;padding:14px 8px;border-radius:10px;background:var(--pan2);box-shadow:inset 0 0 0 1px var(--line);margin:0 8px 12px 0;vertical-align:top;cursor:pointer}
.cbcard.maj{box-shadow:inset 0 0 0 2px var(--gold);background:#2b2512}
.cbcard img{width:64px;height:64px;object-fit:contain}
.cbcard .cbn{font-size:11px;font-weight:600;text-align:center;line-height:1.25}
/* player of the patch */
.potw{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#2b2512,var(--pan2));border-radius:8px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--gold);cursor:pointer}
.potw .pimg{width:62px;height:72px;border-radius:6px;object-fit:cover;object-position:top;flex:0 0 auto;background:#dde2e7}
.potw .pmid{flex:1;min-width:0}
.potw .plbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);font-weight:800}
.potw .pnk{font-size:20px;font-weight:800;margin:2px 0}
.potw .psub{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.potw .pbig{text-align:center;flex:0 0 auto}
.potw .pbig b{font-size:30px;font-weight:800;color:var(--gold);display:block;line-height:1}
.potw .pbig span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
/* form tiles with opponent logos */
.ftiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ftile{flex:1;min-width:76px;max-width:118px;background:var(--pan2);border-radius:7px;padding:10px 6px;text-align:center;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.ftile img{width:34px;height:34px;object-fit:contain;margin:0 auto 6px;display:block}
.ftile .fini{width:34px;height:34px;border-radius:5px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#1a1f24}
.ftile .fon{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .fsc{font-size:11px;color:var(--tx);margin-top:1px;font-weight:700}
.ftile .fres{margin-top:6px;font-size:10px;font-weight:800;padding:2px 0;border-radius:4px;color:#fff}
.ftile .fres.w{background:#2f7d43}.ftile .fres.l{background:#a33b34}
/* map win statistics */
.maprow{display:flex;align-items:center;gap:10px;margin:6px 0}
.maprow .mn{width:92px;flex:0 0 auto;font-weight:700;font-size:12.5px}
.maprow .mtrack{flex:1;height:20px;background:var(--dark);border-radius:4px;overflow:hidden}
.maprow .mfill{height:100%;border-radius:4px;min-width:2px}
.maprow .mpct{width:96px;text-align:right;flex:0 0 auto;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.maprow .mpct span{color:var(--mut);font-weight:400;font-size:11px}
/* transfer cards */
.trfcards{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}
.trfcard{flex:0 0 auto;width:206px;background:var(--pan2);border-radius:8px;padding:12px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.trfcard .th{display:flex;align-items:center;gap:9px}
.trfcard .tph{width:40px;height:46px;border-radius:5px;object-fit:cover;object-position:top;flex:0 0 auto;background:#dde2e7}
.trfcard .tnk{font-weight:700;font-size:14px}
.trfcard .tmove{display:flex;align-items:center;justify-content:center;gap:10px;margin:11px 0 9px}
.trfcard .tmove img{width:30px;height:30px;object-fit:contain}
.trfcard .tmove .tini{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#1a1f24}
.trfcard .tmove .arr{color:var(--gold);font-size:18px;font-weight:800}
.trfcard .tfee{text-align:center;font-weight:800;color:var(--gold);font-size:15px}
/* world ranking development */
.rkdev{display:flex;gap:30px;margin-bottom:8px}
.rkdev .c span{color:var(--mut);font-size:11px;display:block}
.rkdev .c b{font-size:22px}
/* stat leaders (top-3 podiums) */
.ldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ldcard{background:var(--pan2);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.ldh{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:var(--dark);font-weight:700}
.ldrow{display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;border-top:1px solid var(--line)}
.ldrow:hover{background:var(--pan)}
.ldrow .ldm{font-size:15px;flex:0 0 auto;width:18px;text-align:center}
.ldrow .av{width:26px;height:26px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:flex}
.ldrow .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.ldrow .ldn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.ldrow .ldv{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.grow{color:var(--good);font-weight:700}
.rrow .rpts{flex:0 0 auto;text-align:right;min-width:56px}
.rrow .rpts b{font-size:14px;font-weight:800;display:inline}
.rrow .rpts span{color:var(--mut);font-size:10px;margin-left:2px}
.moves{display:flex;flex-direction:column;gap:5px}
.mvrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mvrow .mvin{color:var(--good);font-weight:800;width:16px;flex:0 0 auto}
.mvrow .mvout{color:var(--bad);font-weight:800;width:16px;flex:0 0 auto}
.mvrow .av{width:34px;height:38px;border-radius:5px;overflow:hidden;flex:0 0 auto;display:block;background:#20272e}
.mvrow .av img{width:100%;height:100%;object-fit:cover;object-position:top}
/* H2H + streak + form tiles */
.h2pill{display:inline-block;min-width:30px;text-align:center;padding:2px 5px;margin:1px;border-radius:4px;font-size:10px;font-weight:700;color:#fff}
.h2pill.w{background:#2e7d43}.h2pill.l{background:#a5392f}
.streak{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.stbig{font-size:15px;font-weight:800}.stbig.w{color:#4ba85a}.stbig.l{color:#c86b63}
.wlrow{display:flex;gap:4px;flex-wrap:wrap}
.wl{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.wl.w{background:#2e7d43}.wl.l{background:#a5392f}
/* MVP coin badge + tournament tooltip */
.mvpcoin{vertical-align:middle;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.mvpb{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:help;font-weight:800;color:var(--gold);line-height:1}
.mvpb.evp{color:#aeb7c4}
.mvptip{position:absolute;bottom:135%;left:50%;transform:translateX(-50%);background:#0d1116;color:#e8edf2;border:1px solid var(--gold);border-radius:7px;padding:7px 10px;font-size:11px;font-weight:600;z-index:80;opacity:0;visibility:hidden;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.55);pointer-events:none;max-width:260px;white-space:normal;text-align:left}
.mvpb.evp .mvptip{border-color:#7f8b9c}
.mvptip:before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold)}
.mvpb.evp .mvptip:before{border-top-color:#7f8b9c}
.mvpb:hover .mvptip{opacity:1;visibility:visible}
.mvptip b{color:var(--gold);display:block;margin-bottom:3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.mvptip .ev{display:block;padding:1px 0}
.mvphead{display:inline-flex;align-items:center;gap:9px}
/* season awards (nomination cards) */
.awgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.awcard{background:var(--pan2);border-radius:8px;padding:12px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.awcard:hover{background:#3e4b5a}
.awlbl{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:8px;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center}
.awph{width:72px;height:84px;border-radius:6px;object-fit:cover;object-position:top;background:#dde2e7}
.awnk{font-weight:700;margin-top:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.awrt{color:var(--mut);font-size:11px;margin-top:2px}
/* nationality breakdown */
.natrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.natc{width:150px;flex:0 0 auto;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nattrack{flex:1;height:16px;background:var(--dark);border-radius:4px;overflow:hidden}
.natfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--acc));border-radius:4px;min-width:2px}
.natn{width:86px;text-align:right;flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
/* ===== HLTV-style shell: fixed top bar, wide layout, sidebar, sticky tabs ===== */
body{padding-top:46px}
.topbar{position:fixed;top:0;left:0;right:0;height:46px;background:#12171c;border-bottom:1px solid #0a0e12;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tb-inner{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;gap:12px;padding:0 16px}
.tb-logo{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.tb-logo.ini{border-radius:5px;background:var(--pan2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--tx)}
.tb-name{font-weight:800;font-size:15px;letter-spacing:.3px}
.tb-name span{color:var(--mut);font-weight:600;font-size:11px;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:22px}
.tb-stat{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tb-stat b{color:var(--tx);font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums}
.tb-stat b.cash{color:var(--good)}
.tb-search{position:relative;margin-left:20px;flex:0 1 300px}
.tb-search input{width:100%;background:var(--dark);border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:7px 11px;font-size:12px;font-family:inherit}
.tb-search input:focus{outline:none;border-color:var(--blue)}
.gsres{display:none;position:absolute;top:38px;left:0;right:0;background:var(--pan);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-height:340px;overflow:auto;z-index:60}
.gsrow{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.gsrow:hover{background:var(--pan2)}
.gsrow img{width:24px;height:24px;object-fit:cover;object-position:top;border-radius:4px;flex:0 0 auto;background:#20272e}
.gsrow .gsi{width:24px;height:24px;flex:0 0 auto}
.gsrow .gsn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gsrow .gstag{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto}
th.srt-th:hover{color:var(--tx)}
.pzcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pzbar{flex:0 1 80px;height:8px;background:var(--dark);border-radius:3px;overflow:hidden}
.pzbar i{display:block;height:100%;background:linear-gradient(90deg,#c98a1e,var(--gold))}
.pzcell b{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:164px minmax(0,1fr) 288px;gap:14px;align-items:start}
.main{min-width:0}
.side{position:sticky;top:58px;display:flex;flex-direction:column;gap:12px}
/* left vertical navigation — every tab visible at once, no scroll, no wrapping */
.lnav{position:sticky;top:58px;display:flex;flex-direction:column;gap:2px;background:var(--pan);border-radius:9px;padding:7px}
.lnav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;white-space:nowrap;transition:background .12s,color .12s}
.lnav button .ti{font-size:15px;width:19px;text-align:center;flex:0 0 auto}
.lnav button:hover:not(.on){color:var(--tx);background:rgba(255,255,255,.05)}
.lnav button.on{background:var(--pan2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.swid{background:var(--pan);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.swid h4{margin:0;padding:10px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:var(--dark);border-bottom:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.srow:hover{background:var(--pan2)}
.srow .sr-rk{width:20px;color:var(--mut);font-weight:800;text-align:center;flex:0 0 auto}
.srow img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.srow .sr-ph{border-radius:4px;object-fit:cover;object-position:top;background:#dde2e7}
.srow .sr-ini{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;color:#1a1f24;flex:0 0 auto}
.srow .sr-ic{width:22px;text-align:center;flex:0 0 auto}
.srow .sr-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sr-fee{color:var(--gold);font-weight:700;font-size:12px;flex:0 0 auto}
.srow.more{justify-content:flex-end;color:var(--acc);font-size:11px;font-weight:600;border-bottom:none}
.srow.more:hover{color:var(--blue);background:transparent}
.tabs{position:sticky;top:46px;z-index:20;box-shadow:0 3px 8px rgba(0,0,0,.28)}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .lnav{position:static;order:1;flex-direction:row;flex-wrap:wrap}
 .lnav button{width:auto}
 .main{order:2}
 .side{position:static;order:3}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function _tip(events,label){if(!events||!events.length)return '';return '<span class="mvptip"><b>'+label+'</b>'+events.map(function(e){return '<span class="ev">🏆 '+esc(e)+'</span>';}).join('')+'</span>';}
// gold MVP coin with count; hover shows the tournament(s) it was won at
function mvpBadge(p,sz){if(!p||!p.mvp)return '';sz=sz||20;
 return '<span class="mvpb"><img class="mvpcoin" src="'+MVP_IMG+'" style="width:'+sz+'px;height:'+sz+'px">×'+p.mvp+_tip(p.mvpEvents,'MVP турниров')+'</span>';}
function evpBadge(p){if(!p||!p.evp)return '';
 return '<span class="mvpb evp">EVP ×'+p.evp+_tip(p.evpEvents,'EVP турниров')+'</span>';}
// compact coin for table cells (native title = tournament list, no clipping)
function mvpCell(p){if(!p||!p.mvp)return '0';var t=(p.mvpEvents||[]).join(' • ');
 return '<span class="mvpb" title="'+esc(t)+'"><img class="mvpcoin" src="'+MVP_IMG+'" style="width:15px;height:15px">'+p.mvp+'</span>';}
function evpCell(p){if(!p||!p.evp)return '0';var t=(p.evpEvents||[]).join(' • ');
 return '<span title="'+esc(t)+'" style="cursor:help">'+p.evp+'</span>';}

// team form built from per-map scoreboards (chronological): W/L pills + cumulative line
function teamForm(){const sb=(D.scoreboards||[]);if(!sb.length)return '';
 const res=sb.map(m=>({win:m.myScore>m.oppScore,opp:m.opp,mine:m.myScore,os:m.oppScore,map:m.map}));
 const wins=res.filter(r=>r.win).length,n=res.length;
 let mo=0;const pts=res.map(r=>{mo+=r.win?1:-1;return mo;});
 const min=Math.min(0,...pts),max=Math.max(1,...pts),W=760,H=150,pad=22;
 const xs=i=>pad+i*(W-2*pad)/Math.max(1,pts.length-1),ys=v=>H-pad-(v-min)/(max-min||1)*(H-2*pad);
 const path=pts.map((v,i)=>(i?'L':'M')+xs(i).toFixed(0)+' '+ys(v).toFixed(0)).join(' ');
 const area=pts.length>1?path+' L'+xs(pts.length-1).toFixed(0)+' '+(H-pad)+' L'+pad+' '+(H-pad)+' Z':'';
 const last=res.slice(-15);
 const pills='<div class="fbar">'+last.map(r=>`<div class="fpill ${r.win?'w':'l'}" title="${r.map} vs ${r.opp}">${r.mine}:${r.os}</div>`).join('')+'</div>';
 const kpis=`<div class="chartkpis"><div class="c"><b>${wins}-${n-wins}</b><span>W-L (${n} карт)</span></div><div class="c"><b>${Math.round(wins/n*100)}%</b><span>Винрейт</span></div><div class="c"><b>#${T.rank||'-'}</b><span>Мировой ранг</span></div></div>`;
 const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><path d="${area}" fill="rgba(240,168,58,.12)"/><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>${pts.map((v,i)=>`<circle cx="${xs(i).toFixed(0)}" cy="${ys(v).toFixed(0)}" r="2.5" fill="var(--acc)"/>`).join('')}</svg>`;
 return kpis+pills+svg;}

// some simulated matches store a record-GUID instead of a real map name — treat as unknown

// map win statistics from per-map scoreboards
function mapStats(){const sb=(D.scoreboards||[]);if(!sb.length)return '';
 const agg={};sb.forEach(m=>{let k=m.map||'?';if(isGuidMap(k))k='__other';const a=agg[k]||(agg[k]={w:0,n:0});a.n++;if(m.myScore>m.oppScore)a.w++;});
 const rows=Object.entries(agg).map(([m,a])=>({m,w:a.w,n:a.n,pct:a.w/a.n}));
 rows.sort((x,y)=>{if(x.m==='__other')return 1;if(y.m==='__other')return -1;return y.pct-x.pct||y.n-x.n;});
 if(!rows.length)return '';
 const colFor=p=>p>=0.6?'#4ba85a':p>=0.4?'#e0a53a':'#c1504a';
 const label=m=>m==='__other'?'Другие':mapClean(m);
 return rows.map(r=>`<div class="maprow"><div class="mn">${label(r.m)}</div><div class="mtrack"><div class="mfill" style="width:${Math.round(r.pct*100)}%;background:${colFor(r.pct)}"></div></div><div class="mpct">${Math.round(r.pct*100)}% <span>(${r.w}-${r.n-r.w})</span></div></div>`).join('');}

 return '<table><thead><tr><th>Соперник</th><th>Карт</th><th>W–L</th><th>%</th><th>Раунды</th><th>Последние</th></tr></thead><tbody>'+body+'</tbody></table>';}

 var W=760,H=150,pad=26;var vals=vh.map(function(x){return x[1];}),rats=vh.map(function(x){return x[2];});
 var vmax=Math.max.apply(null,vals)||1,rmin=Math.min.apply(null,rats),rmax=Math.max.apply(null,rats)||1;
 var xs=function(i){return pad+i*(W-2*pad)/(vh.length-1);};
 var yv=function(v){return H-pad-(v/vmax)*(H-2*pad);};
 var yr=function(r){var sp=(rmax-rmin)||1;return H-pad-((r-rmin)/sp)*(H-2*pad);};
 var vpath=vh.map(function(x,i){return (i?'L':'M')+xs(i).toFixed(0)+' '+yv(x[1]).toFixed(0);}).join(' ');
 var rpath=vh.map(function(x,i){return (i?'L':'M')+xs(i).toFixed(0)+' '+yr(x[2]).toFixed(0);}).join(' ');
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><path d="'+vpath+'" fill="none" stroke="#4ba85a" stroke-width="2.5"/><path d="'+rpath+'" fill="none" stroke="var(--gold)" stroke-width="2.5"/></svg><div style="font-size:11px;color:var(--mut)"><span style="color:#4ba85a">━</span> стоимость · <span style="color:var(--gold)">━</span> рейтинг</div>';}

const RGRP=[['Аим',[0,2,9]],['Реакция',[1,3]],['Клатч',[4,12]],['Тактика',[5,6,15]],['Энтри',[7,10]],['Саппорт',[8,13]],['Лидерство',[14,16]],['Стабильн.',[11,17,18,19]]];
function radarSVG(attrs){
 if(!attrs||!Object.keys(attrs).length)return '';
 const g=idx=>{let s=0,c=0;idx.forEach(i=>{const v=attrs[i];if(v!=null){s+=+v;c++;}});return c?s/c:0;};
 const axes=RGRP.map(([lab,idx])=>({lab,v:g(idx)})),N=axes.length,cx=130,cy=130,R=92,max=20;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 let rings='';[0.25,0.5,0.75,1].forEach(f=>{rings+='<polygon points="'+axes.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>';});
 let spokes='',labels='';axes.forEach((ax,i)=>{const p=pt(i,R);spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="var(--line)"/>';const l=pt(i,R+15);labels+='<text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'" fill="var(--mut)" font-size="10" text-anchor="middle" dominant-baseline="middle">'+ax.lab+'</text>';});
 const poly=axes.map((ax,i)=>pt(i,R*Math.min(1,ax.v/max)).map(n=>n.toFixed(1)).join(',')).join(' ');
 const dots=axes.map((ax,i)=>{const p=pt(i,R*Math.min(1,ax.v/max));return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--blue)"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" fill="var(--tx)" font-size="10" font-weight="700" text-anchor="middle">'+ax.v.toFixed(1)+'</text>';}).join('');
 return '<svg viewBox="0 0 260 260" style="width:100%;max-width:300px;height:auto;display:block;margin:4px auto">'+rings+spokes+'<polygon points="'+poly+'" fill="rgba(91,157,217,.28)" stroke="var(--blue)" stroke-width="2"/>'+dots+labels+'</svg>';}
// rating-over-matches development line
function devSVG(hist){
 if(!hist||hist.length<2)return '';
 const W=760,H=120,pad=18,min=Math.min.apply(null,hist),max=Math.max.apply(null,hist),span=(max-min)||1;
 const xs=i=>pad+i*(W-2*pad)/(hist.length-1),ys=v=>H-pad-(v-min)/span*(H-2*pad);
 const path=hist.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
 const area=path+' L'+xs(hist.length-1).toFixed(1)+' '+(H-pad)+' L'+pad+' '+(H-pad)+' Z';
 const avg=hist.reduce((a,b)=>a+b,0)/hist.length;
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><path d="'+area+'" fill="rgba(240,168,58,.12)"/><line x1="'+pad+'" y1="'+ys(avg).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+ys(avg).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/><path d="'+path+'" fill="none" stroke="var(--gold)" stroke-width="2.5"/>'+hist.map((v,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.5" fill="var(--acc)"/>').join('')+'</svg>';}

// make any <table> sortable by clicking a column header
function makeSortable(table){
 if(!table||table.__srt||!table.tHead)return;table.__srt=1;
 var ths=table.tHead.rows[0].cells;
 Array.prototype.forEach.call(ths,function(th,ci){
  th.classList.add('srt-th');th.style.cursor='pointer';var dir=1;
  th.onclick=function(e){if(e&&e.stopPropagation)e.stopPropagation();
   var tb=table.tBodies[0];if(!tb)return;var rows=Array.prototype.slice.call(tb.rows);
   var num=function(s){var m=(''+s).replace(/[^0-9.\-]/g,'');return (m===''||m==='-'||m==='.')?null:parseFloat(m);};
   rows.sort(function(a,b){var x=(a.cells[ci]?a.cells[ci].textContent:'').trim(),y=(b.cells[ci]?b.cells[ci].textContent:'').trim();var nx=num(x),ny=num(y);if(nx!=null&&ny!=null)return (nx-ny)*dir;return x.localeCompare(y,'ru')*dir;});
   dir=-dir;rows.forEach(function(r){tb.appendChild(r);});
  };
 });
}
function applySort(){document.querySelectorAll('#views table').forEach(makeSortable);}

// world-ranking development: rank over time (rank #1 at the top, inverted y-axis)

 const last=ranks.length-1;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${gl(min)}${max!==min?gl(max):''}<path d="${area}" fill="rgba(240,168,58,.10)"/><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>${ranks.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="2.2" fill="var(--acc)"/>`).join('')}<circle cx="${xs(last).toFixed(1)}" cy="${ys(ranks[last]).toFixed(1)}" r="4" fill="var(--gold)"/></svg>`;}

// Live polling — only active when the page is served from the localhost server.
(function(){
  var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  // real-time money + world rank (no reload needed)
  setInterval(function(){
    fetch('/live?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(!j) return;
      if(j.balance!=null){ set('liveCash', fmt(j.balance)); set('tbCash', fmt(j.balance)); }
      if(j.rank!=null){ set('lr1','#'+j.rank); set('lr2','#'+j.rank); set('tbRank','#'+j.rank); }
    }).catch(function(){});
  }, 3000);
  // Apply new data (after the game saves) AUTOMATICALLY — but never yank you mid-action.
  // We remember your tab / scroll / open card, refresh, and put you right back, so it
  // feels like a live update instead of a manual reload.
  var modalOpen=function(){var m=document.getElementById('modal');return !!(m&&m.classList.contains('on'));};
  function tcSave(){try{sessionStorage.setItem('tc_state',JSON.stringify({t:(window.__tcTab||'info'),y:Math.round(window.scrollY||0),n:modalOpen()?(window.__tcNick||null):null}));}catch(e){}}
  var lastAct=Date.now();
  ['click','keydown','wheel','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now();},{passive:true});});
  setInterval(tcSave,2000);
  var baseV=null, stale=false;
  fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){baseV=j.v;}).catch(function(){});
  function pill(on){var p=document.getElementById('refreshPill');
    if(on){ if(!p){p=document.createElement('div');p.id='refreshPill';p.innerHTML='🔄 обновляю…';p.onclick=function(){tcSave();location.reload();};document.body.appendChild(p);} }
    else if(p){p.remove();}
  }
  setInterval(function(){
    fetch('/version?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(baseV!=null && j && j.v && j.v!==baseV){ stale=true; }
    }).catch(function(){});
  }, 3000);
  // auto-apply loop: refresh by itself once you're not busy and no card is open
  setInterval(function(){
    if(!stale) return;
    pill(true);
    if(modalOpen()) return;                 // reading a player card -> wait
    if(Date.now()-lastAct < 4000) return;   // you just interacted -> wait a moment
    tcSave(); location.reload();
  }, 1200);
})();
