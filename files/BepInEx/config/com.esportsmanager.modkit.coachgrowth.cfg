## Settings file was created by plugin EM CoachGrowth v0.1.0
## Plugin GUID: com.esportsmanager.modkit.coachgrowth

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[Decline]

## 判定一轮游的名次比例阈值。名次比例达到该值计一次失利。
# Setting type: Double
# Default value: 0.75
PoorFinishPlaceRatio = 0.75

## 连续失利达到该次数触发一次衰退。
# Setting type: Int32
# Default value: 3
DeclineStreakThreshold = 3

## 单次衰退的属性步长。
# Setting type: Double
# Default value: 0.1
AttributeStepDown = 0.1

## 属性下限。避免降到 0 破坏 rating 计算。
# Setting type: Double
# Default value: 1
AttributeFloor = 1

[Defaults]

## 首次发现一支队伍时生成的档案是否默认启用。EM-41 真机验证阶段默认 true，使新档玩家队教练即可累积成长。
# Setting type: Boolean
# Default value: true
DefaultTeamEnabled = true

[General]

## 总开关。EM-41 真机验证阶段默认 true。写教练属性属存档写入例外，请先备份存档、确认后再开启。
# Setting type: Boolean
# Default value: true
Enabled = true

## 记录未参赛、无教练、封顶等详细原因。
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Growth]

## 每日基线成长增量。教练在职、队伍活动时每个游戏日累积一次（同一天不重复）。
# Setting type: Double
# Default value: 0.001
DailyBaseGain = 0.001

## T1 赛事夺冠时的基础成长增量（顶级，含金量高于 T2）。
# Setting type: Double
# Default value: 0.08
BaseTierPointsT1 = 0.08

## T2 赛事夺冠时的基础成长增量（次级，含金量低于 T1）。
# Setting type: Double
# Default value: 0.04
BaseTierPointsT2 = 0.04

## Major 赛事夺冠时的基础成长增量（含金量最高）。
# Setting type: Double
# Default value: 0.15
BaseTierPointsMajor = 0.15

## 线下赛（LAN）额外成长系数，应大于等于 1。
# Setting type: Double
# Default value: 1.25
LanBonus = 1.25

## 落账步长。累积池每满一个该步长，就把一步（经软门槛系数折算）落到属性上（属性 0-20 尺度）。
# Setting type: Double
# Default value: 0.05
AccrualStep = 0.05

## 三年滚动窗口内净提升的软门槛。达到后落账步长乘 SlowdownFactor 放缓，不完全停止。
# Setting type: Double
# Default value: 3
SoftCapThreshold = 3

## 软门槛之后的放缓系数（0-1）。三年窗口净提升达软门槛后，每步实际增量乘以该系数。
# Setting type: Double
# Default value: 0.3
SlowdownFactor = 0.3

## 三年滚动窗口内净提升的硬顶。达到后不再落账，作为绝对上限兜底。
# Setting type: Double
# Default value: 6
HardCapWithinWindow = 6

## 滚动窗口年数（严格滚动，不按自然年归零）。
# Setting type: Int32
# Default value: 3
WindowYears = 3

[Safety]

## 只使用当前在任的教练；否则没有合格教练时不结算。
# Setting type: Boolean
# Default value: true
RequireActiveCoach = true

