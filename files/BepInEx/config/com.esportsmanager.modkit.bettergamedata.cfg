## Settings file was created by plugin EM Better Game Data v0.1.0
## Plugin GUID: com.esportsmanager.modkit.bettergamedata

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不安装探针，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制接管（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[Diagnostics]

## 本次游戏进程最多写出多少份影子报告。0 表示不写文件，只记录有限日志。
# Setting type: Int32
# Default value: 50
MaxReportsPerSession = 50

## 启动后前 N 次 GenerateMapStats 捕获写入简要日志。0 关闭。
# Setting type: Int32
# Default value: 20
LogFirstN = 20

## 影子报告目录。留空时使用 BepInEx/config/em-better-game-data/reports。
# Setting type: String
# Default value: 
ReportDirectory = 

## 报告中是否包含影子逐回合事件。关闭后报告更小，但仍保留汇总和校验结果。
# Setting type: Boolean
# Default value: true
IncludeRoundEvents = true

[General]

## 是否启用 EM-29 Better Game Data。启用后按 [Takeover]Takeover 决定是接管改写还是只影子观察。
# Setting type: Boolean
# Default value: true
Enabled = true

[Takeover]

## 接管模式总开关。true（默认）=用新数据模型重算每图选手统计并改写原生比赛记录（会写存档），使数据分布对齐真实 CS；false=只影子观察不改数据。比分/胜负始终保持原生不变。
# Setting type: Boolean
# Default value: true
Takeover = true

## 历史重算（一次性）。true 且接管模式开启时，本次启动会把存档里已有的比赛用新模型重算并写回存档（一次性批处理，改写后建议手动关回避免重复）。默认关。
# Setting type: Boolean
# Default value: false
RecomputeHistoryOnce = false

