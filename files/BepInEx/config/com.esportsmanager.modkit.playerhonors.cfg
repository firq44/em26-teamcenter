## Settings file was created by plugin EM PlayerHonors v0.1.0
## Plugin GUID: com.esportsmanager.modkit.playerhonors

[Collect]

## 枚举比赛 / 赛事 id 的硬上限，防极端存档卡顿。
# Setting type: Int32
# Default value: 5000
ScanCap = 5000

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[General]

## 总开关。false 时不打任何补丁。
# Setting type: Boolean
# Default value: true
Enabled = true

## 是否展示 EVP 列。仅当检测到 EmtvEvp 插件已安装时才生效；未装 EmtvEvp 时本项无效、不显示 EVP。
# Setting type: Boolean
# Default value: true
ShowEvp = true

## 详细日志（打印每条荣誉明细，仅调试用）。
# Setting type: Boolean
# Default value: false
VerboseLogging = false

