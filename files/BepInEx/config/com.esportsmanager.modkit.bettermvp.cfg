## Settings file was created by plugin EM BetterMVP v0.1.0
## Plugin GUID: com.esportsmanager.modkit.bettermvp

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[General]

## 赛事级 MVP 接管总开关。默认 true（装上即接管）。赛事结算时按 Rating 口径重选赛事 MVP 并覆盖 DataTournament.MVPId，属存档写入。首次使用前请备份存档；如只想纯观测、不写存档，把本项改为 false。
# Setting type: Boolean
# Default value: true
Enabled = true

[Mvp]

## 是否启用分层仲裁（整届 rating 拉不开时逐级下探淘汰赛段、决赛段；三段均逐图复算同源）。启用时整届 rating 改用逐图复算值（与 mvp-dump 分层口径一致）。
# Setting type: Boolean
# Default value: true
StageArbitration = true

## 败者 MVP 差距门槛。仅当亚军队最高分者rating 超过冠军队最高分者达到该值，MVP 才判给亚军选手；否则归冠军队最高分者。真机验证值 0.1。
# Setting type: Double
# Default value: 0.1
RunnerUpMvpMargin = 0.1

## 分层仲裁『拉不开差距』门槛。两名选手同一维度 rating 差的绝对值小于该值视为拉不开，触发向下一阶段下探。真机验证值 0.05。
# Setting type: Double
# Default value: 0.05
TieBreakMargin = 0.05

## 分段比较最小回合门槛。某选手某分段回合数低于该值时，该段视为无数据、不参与下探比较，避免小样本污染。真机验证值 50。
# Setting type: Int32
# Default value: 50
StageMinRounds = 50

[SingleMatch]

## 单场级 MVP 接管总开关。默认 true（装上即接管）。每场比赛结算（MatchesEngine.EndMatch 与 AutoGenerateMatch 两条路径）时 按逐图复算 rating 口径重选整场 MVP 并覆盖 DataMatch.MVPId，属存档写入。单场结算频率高（含大量 AI 对局），首次使用前请备份存档；如只想纯观测、不写存档，把本项改为 false。与赛事级接管相互独立。
# Setting type: Boolean
# Default value: true
Enabled = true

