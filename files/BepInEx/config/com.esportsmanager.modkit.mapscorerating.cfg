## Settings file was created by plugin EM MapScoreRating v0.1.0
## Plugin GUID: com.esportsmanager.modkit.mapscorerating

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[General]

## 总开关。false 时不打任何补丁（记分板完全原样）。
# Setting type: Boolean
# Default value: true
Enabled = true

## 优先走路线 B：按 playerId 反查本局 MapRecord 算精确 2.1-EM（口径同 Rating21）。拿不到（对局进行中 / 记录未写入 / 反查途径未接通）时自动回退路线 A 近似。false 时恒走路线 A。
# Setting type: Boolean
# Default value: true
PreferMapRecord = true

## 详细日志（每次刷新打点，仅调试用）。
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Rating]

## 降基线因子 f（同 Rating21 默认）：把游戏原公式的五个 HLTV 基线同乘 f。1.0=游戏原公式；0.85=EM-29 定案。
# Setting type: Double
# Default value: 0.85
BaselineFactor = 0.85

