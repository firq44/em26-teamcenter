## Settings file was created by plugin EM Rating21 v0.1.0
## Plugin GUID: com.esportsmanager.modkit.rating21

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[General]

## 总开关。false 时不打任何补丁（游戏 rating 完全原样）。
# Setting type: Boolean
# Default value: true
Enabled = true

## 接管原生选手统计排行榜：按角色 + 生涯聚合量把每行 rating 换成 2.1-EM 并回溯修「全红」。
# Setting type: Boolean
# Default value: true
TakeOverStatsUi = true

## 接管选手档案页 OverallStatsView：把生涯 rating 的数值、颜色和动画目标换成角色感知的 2.1-EM；不改 K/D、ADR、KAST 等原始统计。
# Setting type: Boolean
# Default value: true
TakeOverPlayerProfile = true

## 接管选手档案页的比赛历史 / 赛事历史 / 近期比赛三个列表：把每行 rating 换成 2.1-EM 值（与档案页生涯总览、排行榜同口径）；不改 K/D、ADR、KAST 等原始统计。
# Setting type: Boolean
# Default value: true
TakeOverHistoryLists = true

## 对未来对局的每图 impact rating 用 2.1-EM 引擎替换（Prefix GetImpactRating）。检测到 EM-6 RatingFix 时自动让出。
# Setting type: Boolean
# Default value: true
TakeOverMapRating = true

## 排行榜接管时按 rating 重排行并回写名次（Rank）。false 时只改每行数值/着色、不改行序。
# Setting type: Boolean
# Default value: true
ReorderLeaderboard = true

## 详细日志（每次重算/重排打点，仅调试用）。
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Rating]

## 评分引擎选择。false（默认）=绝对锚定·降基线（EM-29定案：rating 是过程量纯函数，不依赖联盟分布）；true=回退到 2.1-EM z-score 相对排名（均值恒为 1.0，需运行时分布 + 角色/IGL 修正）。
# Setting type: Boolean
# Default value: false
UseZScoreEngine = false

## 降基线因子 f（仅绝对锚定引擎用）：把游戏原公式的五个 HLTV 基线同乘 f。1.0=游戏原公式；0.85=EM-29 定案（把 1.0 的对应基准下移 15%，与第一阶段已对齐的过程量配合 → 全联盟平均≈=1.0、顶尖 1.18–1.34）。
# Setting type: Double
# Default value: 0.85
BaselineFactor = 0.85

