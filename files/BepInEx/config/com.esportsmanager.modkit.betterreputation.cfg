## Settings file was created by plugin EM BetterReputation v0.1.0
## Plugin GUID: com.esportsmanager.modkit.betterreputation

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[Defaults]

## 选手导入建档完成时应用开局声望覆盖（Phase 1）。默认 true（在 Enabled=true 前提下生效）。
# Setting type: Boolean
# Default value: true
ApplyOnImport = true

[General]

## 总开关。默认 true，装上即生效。写选手声望属于存档写入，首次启用前建议先备份存档。
# Setting type: Boolean
# Default value: true
Enabled = true

## 记录未命中、档位已一致、配置为空等详细原因。
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Growth]

## 赛事声望成长总开关（Phase 2）。默认 true。订阅赛事结算，为玩家队选手按成绩累积声望并可跨档（具体哪些队生效由 DefaultTeamEnabled 与 growth.json 控制）。
# Setting type: Boolean
# Default value: true
Enabled = true

## 新生成的每队成长档案的默认开关。默认 false，避免首次结算即改动声望；可在 growth.json 里逐队打开。
# Setting type: Boolean
# Default value: false
DefaultTeamEnabled = false

## 声望跨档时是否由公关经理发一封邮件通知。默认 true（在 Growth.Enabled=true 前提下生效）。
# Setting type: Boolean
# Default value: true
MailEnabled = true

[Overrides]

## 开局声望覆盖清单。格式：选手Id:档位，多条用逗号或分号分隔。档位接受英文名(NoName/Novice/Competitor/Prodigy/Decent/Sensation/WorldStar/Superstar/WorldElite/Legend)、中文名或 0-9 数字。留空则不覆盖任何选手。示例：S0ph1a:Novice, M4tr1x:NoName, Talos:NoName
# Setting type: String
# Default value: 
PlayerTiers = 

[Repair]

## 修复早期版本发出、内容为空的旧声望邮件（它们会让玩家打开邮件时卡住、退出重进读档时崩溃）。默认 true：在邮件被显示前就地补上一个游戏原生的「知道了」内容体，只动 Content 为 null的邮件，不碰其余邮件。修复属存档写入，建议保留默认开启。
# Setting type: Boolean
# Default value: true
LegacyMailRepair = true

