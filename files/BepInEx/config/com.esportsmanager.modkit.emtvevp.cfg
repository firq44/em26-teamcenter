## Settings file was created by plugin EM EMTV EVP v0.1.0
## Plugin GUID: com.esportsmanager.modkit.emtvevp

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true 则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
# Setting type: Boolean
# Default value: false
ForceEnable = false

[Evp]

## 是否启用分层仲裁（整届 rating 拉不开时逐级下探淘汰赛段、决赛段；三段均逐图复算同源）。启用时整届 rating 改用逐图复算值（与 evp-dump 分层口径一致），分数线相应用 1.0。
# Setting type: Boolean
# Default value: true
StageArbitration = true

## 入选分数线（rating >= 该值方可入选 EVP）。分层口径真机标定值 1.0（逐图复算值量级低于游戏权威值）。
# Setting type: Double
# Default value: 1
ScoreThreshold = 1

## 最小出场地图门槛，避免小样本入选。选手 MapsPlayed >= 该值方可入选。标定值 6：无论小组赛双败还是瑞士轮，打进淘汰赛哪怕一轮游，最少也有 6 张图记录。
# Setting type: Int32
# Default value: 6
MinMaps = 6

## 最小出场回合门槛，滤除小样本噪声。选手 RoundsPlayed < 该值不入选。真机标定值 100（核心主力普遍 140+ 回合）。
# Setting type: Int32
# Default value: 100
MinRounds = 100

## 淘汰赛出场硬门槛。开启后，未打进淘汰赛（淘汰赛回合为 0）的选手一律不进 EVP。若这届无淘汰赛段（纯循环/小组赛制）或分层仲裁关闭致分段数据缺失，本门槛自动退化不生效，不会清空名单。
# Setting type: Boolean
# Default value: true
RequirePlayoffAppearance = true

## 最小淘汰赛回合门槛。0 表示只要打进淘汰赛即可；设为正数时要求淘汰赛回合达到该值，进一步滤除淘汰赛一轮游的小样本。
# Setting type: Int32
# Default value: 0
MinPlayoffRounds = 0

## 分层仲裁『拉不开差距』门槛。两名选手同一维度 rating 差的绝对值小于该值视为拉不开，触发向下一阶段下探。真机验证值 0.05。
# Setting type: Double
# Default value: 0.05
TieBreakMargin = 0.05

## 分段比较最小回合门槛。某选手某分段回合数低于该值时，该段视为无数据、不参与下探比较。真机验证值 50。
# Setting type: Int32
# Default value: 50
StageMinRounds = 50

## Major 级别赛事的 EVP 名额上限（MVP 之外）。-1 表示不设上限。
# Setting type: Int32
# Default value: 10
MaxCountMajor = 10

## T1 级别赛事的 EVP 名额上限（MVP 之外）。-1 表示不设上限。
# Setting type: Int32
# Default value: 7
MaxCountT1 = 7

## T2 级别赛事的 EVP 名额上限（MVP 之外）。-1 表示不设上限。
# Setting type: Int32
# Default value: 5
MaxCountT2 = 5

[General]

## 总开关。启用后赛事结算时评选并日志输出 EVP 名单（纯派生，只读不写存档）。
# Setting type: Boolean
# Default value: true
Enabled = true

