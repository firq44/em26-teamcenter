## Settings file was created by plugin EM Match Winrate Tuning v0.1.0
## Plugin GUID: com.esportsmanager.modkit.quicksimwinrate

[AI vs AI]

## 是否接管纯 AI vs AI 对局。false 时这类比赛完整透传游戏原版 [0.25,0.75] 分支；玩家参与比赛仍用 Model。
## 判定镜像游戏：GlobalValues.TeamId 不等于 Team1Id 且不等于 Team2Id。
## 
# Setting type: Boolean
# Default value: true
Enabled = false

## 纯 AI vs AI 的 power 差 logistic 尺度。默认 0.1，与游戏原公式一致。
## 
# Setting type: Single
# Default value: 0.1
Scale = 0.1

## 纯 AI vs AI 的弱队保底胜率 [0,1]。默认 5%，保留联赛冷门空间。
## 
# Setting type: Single
# Default value: 0.05
Floor = 0.05

## 纯 AI vs AI 的强队封顶胜率 [0,1]。默认 95%，解除原版 75% 硬帽但不使用玩家侧 98%。
## 
# Setting type: Single
# Default value: 0.95
Ceil = 0.95

[Compatibility]

## 兼容自检的关键 hook 签名自检未通过时是否强制启用。默认 false（不通过则不打补丁，最安全）。游戏小热修复通常不动 hook 目标、会被签名自检自动放行；仅当签名自检也未通过（可能是较大更新）时本项才起作用：设为 true则风险自担强制安装补丁（游戏若有较大改动，可能行为异常甚至影响存档）。Unity 版本不匹配时本项无效。
## 
# Setting type: Boolean
# Default value: false
ForceEnable = false

[Diagnostics]

