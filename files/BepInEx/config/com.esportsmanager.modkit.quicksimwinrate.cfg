## 
# Setting type: Int32
# Default value: 30
LogFirstN = 30

## 启动后为纯 AI vs AI 额外打印前 N 次 scope/行动/队伍 ID/power/胜率，用于真机验证分类和独立模型。0 关闭。
## 
# Setting type: Int32
# Default value: 20
LogFirstAiVsAiN = 20

